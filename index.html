            '44072630': /lauan|meranti|seraya|alan/i,
            '44072690': /lauan|meranti|seraya|alan/i,
            '44072720': /sapelli/i, '44072730': /sapelli/i, '44072790': /sapelli/i,
            '44072810': /iroko/i, '44072890': /iroko/i,
            '44072912': /jelutong/i, '44072913': /jelutong/i, '44072919': /jelutong/i,
            '44072922': /kapur/i, '44072923': /kapur/i, '44072929': /kapur/i,
            '44072932': /kempas/i, '44072933': /kempas/i, '44072939': /kempas/i,
            '44072942': /keruing/i, '44072943': /keruing/i, '44072949': /keruing/i,
            '44072951': /ramin/i, '44072959': /ramin/i,
            '44072972': /balau|shorea/i, '44072973': /balau|shorea/i, '44072979': /balau|shorea/i,
            '44072982': /mengkulang|heritiera/i, '44072983': /mengkulang|heritiera/i, '44072989': /mengkulang|heritiera/i,
            '44072991': /jongkong|merbau|dactylocladus|intsia/i,
            '44072992': /jongkong|merbau|dactylocladus|intsia/i,
            '44072994': /albizia|falcataria/i, '44072995': /albizia|falcataria/i,
            '44072996': /cao su|hevea|rubber/i, '44072997': /cao su|hevea|rubber/i,
            '44079120': /sồi|soi|quercus/i, '44079130': /sồi|soi|quercus/i, '44079190': /sồi|soi|quercus/i,
            '44079210': /dẻ gai|de gai|fagus/i, '44079290': /dẻ gai|de gai|fagus/i,
            '44079310': /thích|thich|acer|maple/i, '44079390': /thích|thich|acer|maple/i,
            '44079410': /anh đào|anh dao|prunus|cherry/i, '44079490': /anh đào|anh dao|prunus|cherry/i,
            '44079510': /tần bì|tan bi|fraxinus|ash/i, '44079590': /tần bì|tan bi|fraxinus|ash/i,
            '44079610': /bạch dương|bach duong|betula|birch/i, '44079690': /bạch dương|bach duong|betula|birch/i,
            '44079710': /dương|duong|populus|poplar|aspen/i, '44079790': /dương|duong|populus|poplar|aspen/i
        };

        const DEFAULT_TAX_OPTIONS = [0, 3, 5, 8, 10, 15, 20];
        const INITIAL_KEYWORDS = ["đa năng", "tổng hợp", "hỗn hợp", "kết hợp", "tích hợp", "chế phẩm", "linh kiện", "bộ", "hệ thống", "tháo rời", "phụ tùng", "pha trộn", "đa loại"];

        const EMPTY_FORM = {
            decNo: '', sku: '', itemName: '', hsDeclared: '',
            importTax: '', vatRate: 10, unitPrice: '', qty: ''
        };

        const normalizeHS = (code) => (code || '').toString().replace(/[.\s]/g, '').trim();
        const formatHS = (code8) => code8.replace(/(\d{4})(\d{2})(\d{2})/, "$1.$2.$3");
        const normalizeVN = (s) => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
        const nowStr = () => new Date().toISOString().replace('T', ' ').substring(0, 16);
        const showVal = (v, fallback = '—') => (v === '' || v === null || v === undefined) ? fallback : v;

        const testPattern = (pattern, text) => {
            if (!pattern) return true;
            if (pattern.test(text)) return true;
            try {
                const normalizedSource = normalizeVN(pattern.source);
                const flags = pattern.flags || 'i';
                return new RegExp(normalizedSource, flags).test(text);
            } catch (e) {
                return false;
            }
        };

        function App() {
            const [userRole, setUserRole] = React.useState('STAFF');
            const [activeTab, setActiveTab] = React.useState('create');
            const [sensitiveKeywords, setSensitiveKeywords] = React.useState(INITIAL_KEYWORDS);
            const [newKeywordInput, setNewKeywordInput] = React.useState('');
            const [formData, setFormData] = React.useState({ ...EMPTY_FORM });
            const [nameConfirmed, setNameConfirmed] = React.useState(false);
            const [overrideRequests, setOverrideRequests] = React.useState([]);
            const [declarations, setDeclarations] = React.useState([]);
            const [overrideModalOpen, setOverrideModalOpen] = React.useState(false);
            const [transmitModalOpen, setTransmitModalOpen] = React.useState(false);
            const [transmitOverrideId, setTransmitOverrideId] = React.useState(null);
            const [viewingDeclaration, setViewingDeclaration] = React.useState(null);
            const [viewingOverride, setViewingOverride] = React.useState(null);
            const [toast, setToast] = React.useState(null);
            const toastTimerRef = React.useRef(null);

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                toastTimerRef.current = setTimeout(() => setToast(null), 3500);
            };

            const hsLookup = React.useMemo(() => {
                const key = normalizeHS(formData.hsDeclared);
                if (!key) return { status: 'EMPTY', ref: null, key };
                const ref = BT2026_REFERENCE[key];
                return ref ? { status: 'FOUND', ref, key } : { status: 'NOT_FOUND', ref: null, key };
            }, [formData.hsDeclared]);

            const currentVatOptions = React.useMemo(() => {
                return hsLookup.status === 'FOUND' ? getVatOptions(hsLookup.ref) : DEFAULT_VAT_OPTIONS;
            }, [hsLookup]);

            const nameHsSemantic = React.useMemo(() => {
                if (!formData.itemName || hsLookup.status !== 'FOUND') {
                    return { status: 'SKIP', details: [] };
                }
                const name = normalizeVN(formData.itemName);
                const code8 = hsLookup.key;
                const heading4 = code8.substring(0, 4);
                const heading = HEADING_PATTERNS[heading4];
                const species = SPECIES_PATTERNS[code8];

                const headingMatched = testPattern(heading ? heading.pattern : null, name);
                const speciesMatched = testPattern(species, name);

                const details = [];
                if (heading && !headingMatched) {
                    details.push(`Tên hàng không đề cập loại sản phẩm của nhóm ${heading4} — cần có: "${heading.label}".`);
                }
                if (species && !speciesMatched) {
                    details.push(`Mã HS ${code8} yêu cầu loài cây cụ thể nhưng tên hàng không đề cập loài tương ứng.`);
                }
                if (headingMatched && speciesMatched) {
                    details.push(`Tên hàng khớp mô tả loại sản phẩm ${heading ? `nhóm ${heading4}` : ''}${species ? ` và loài cây` : ''}.`);
                }
                return {
                    status: headingMatched && speciesMatched ? 'MATCH' : 'MISMATCH',
                    details
                };
            }, [formData.itemName, hsLookup]);

            const cifValue = (parseFloat(formData.unitPrice) || 0) * (parseFloat(formData.qty) || 0);
            const importTaxRate = parseFloat(formData.importTax) || 0;
            const vatRate = parseFloat(formData.vatRate) || 0;
            const importDutyAmount = cifValue * (importTaxRate / 100);
            const vatBase = cifValue + importDutyAmount;
            const vatAmount = vatBase * (vatRate / 100);
            const totalTaxAmount = importDutyAmount + vatAmount;

            const currentTaxOptions = React.useMemo(() => {
                if (hsLookup.status !== 'FOUND') return DEFAULT_TAX_OPTIONS;
                const { mfn, normal } = hsLookup.ref;
                const opts = [...new Set([0, mfn, normal])].sort((a, b) => a - b);
                const cur = parseFloat(formData.importTax);
                if (!isNaN(cur) && !opts.includes(cur)) opts.push(cur);
                return opts.sort((a, b) => a - b);
            }, [hsLookup, formData.importTax]);

            const hsInputClass = (() => {
                const base = "w-full pl-9 pr-9 py-2 text-sm font-mono rounded-lg focus:outline-none focus:ring-2 transition-all font-semibold ";
                if (!nameConfirmed) return base + "border border-slate-200 bg-slate-100 text-slate-400 cursor-not-allowed";
                if (hsLookup.status === 'FOUND') return base + "border border-emerald-400 bg-emerald-50 text-emerald-800 focus:ring-emerald-500";
                if (hsLookup.status === 'NOT_FOUND') return base + "border border-rose-400 bg-rose-50 text-rose-800 focus:ring-rose-500";
                return base + "border border-slate-300 text-blue-700 focus:ring-blue-500";
            })();

            const handleHsChange = (newHS) => {
                if (!nameConfirmed) {
                    showToast("Vui lòng xác nhận tên hàng trước khi nhập mã HS", "error");
                    return;
                }
                const key = normalizeHS(newHS);
                const ref = BT2026_REFERENCE[key];
                if (ref) {
                    const opts = getVatOptions(ref);
                    const currentVat = parseFloat(formData.vatRate);
                    const newVat = opts.includes(currentVat) ? currentVat : ref.vat;
                    setFormData(prev => ({
                        ...prev,
                        hsDeclared: newHS,
                        importTax: String(ref.mfn),
                        vatRate: String(newVat)
                    }));
                } else {
                    setFormData(prev => ({
                        ...prev,
                        hsDeclared: newHS,
                        importTax: '',
                        vatRate: '8'
                    }));
                }
            };

            const handleItemNameChange = (newName) => {
                const wasConfirmed = nameConfirmed;
                setFormData(prev => ({
                    ...prev,
                    itemName: newName,
                    hsDeclared: '',
                    importTax: '',
                    vatRate: 8
                }));
                if (wasConfirmed) {
                    setNameConfirmed(false);
                    showToast("Tên hàng đã thay đổi — mã HS đã được xoá, vui lòng xác nhận lại", "info");
                }
            };

            const handleConfirmName = () => {
                if (!formData.itemName || !formData.itemName.trim()) {
                    showToast("Vui lòng nhập tên hàng hóa trước khi xác nhận", "error");
                    return;
                }
                setNameConfirmed(true);
                showToast("Đã xác nhận tên hàng — mời nhập mã HS", "success");
            };

            const handleUnlockName = () => {
                setNameConfirmed(false);
                setFormData(prev => ({ ...prev, hsDeclared: '', importTax: '', vatRate: 8 }));
                showToast("Đã mở khóa tên hàng — sửa xong nhớ xác nhận lại", "info");
            };

            const inspectRules = React.useCallback(() => {
                let isBlocked = false;

                const layer0 = { name: "Tầng 0: Xác Nhận Tên Hàng Trước Khi Tra Cứu", status: "PASS", details: [] };
                if (nameConfirmed) {
                    layer0.details.push("✓ Tên hàng đã được người dùng xác nhận — cho phép tra cứu mã HS.");
                } else {
                    layer0.status = "FAIL";
                    layer0.details.push("Chưa xác nhận tên hàng. Vui lòng nhấn nút 'Xác nhận & Tra mã HS' trước khi nhập mã HS.");
                    layer0.details.push("Nếu sửa lại tên hàng, mã HS cũ sẽ bị xoá và phải xác nhận lại.");
                    isBlocked = true;
                }

                const layer1 = { name: "Tầng 1: Tra Cứu Mã HS Trong BT2026", status: "PASS", details: [] };
                if (hsLookup.status === 'EMPTY') {
                    layer1.status = "FAIL";
                    layer1.details.push("Chưa nhập mã HS (8 số). Bắt buộc khai báo mã HS để tra cứu biểu thuế BT2026.");
                    isBlocked = true;
                } else if (hsLookup.status === 'NOT_FOUND') {
                    layer1.status = "FAIL";
                    layer1.details.push(`Mã HS [${formData.hsDeclared}] không có trong bảng tham chiếu BT2026 (nhóm 4401-4407).`);
                    isBlocked = true;
                } else {
                    layer1.details.push(`✓ Tra cứu thành công mã HS trong BT2026.`);
                    layer1.details.push(`VAT cho phép: ${currentVatOptions.map(v => v + '%').join(' / ')}.`);
                }

                const layer2 = { name: "Tầng 2: Đối Chiếu Tên Hàng ↔ Mô Tả Mã HS", status: "PASS", details: [] };
                if (nameHsSemantic.status === 'SKIP') {
                    layer2.status = "WARN";
                    layer2.details.push("Chưa đủ dữ liệu để đối chiếu (cần cả tên hàng và mã HS hợp lệ).");
                } else if (nameHsSemantic.status === 'MISMATCH') {
                    layer2.status = "FAIL";
                    layer2.details.push("⚠️ Tên hàng hóa KHÔNG khớp với mô tả của mã HS đã chọn — chặn truyền tờ khai.");
                    nameHsSemantic.details.forEach(d => layer2.details.push(d));
                    isBlocked = true;
                } else {
                    nameHsSemantic.details.forEach(d => layer2.details.push(d));
                }

                const layer3 = { name: "Tầng 3: Kiểm Tra Thuế NK & Thuế GTGT (BT2026)", status: "PASS", details: [] };
                const taxVal = parseFloat(formData.importTax);
                const vatVal = parseFloat(formData.vatRate);

                if (hsLookup.status !== 'FOUND') {
                    layer3.status = "FAIL";
                    layer3.details.push("Chưa xác thực mã HS → không thể đối chiếu thuế suất theo BT2026.");
                    isBlocked = true;
                } else if (isNaN(taxVal)) {
                    layer3.status = "FAIL";
                    layer3.details.push("Chưa chọn Thuế suất Nhập khẩu. Bắt buộc chọn mức thuế theo BT2026.");
                    isBlocked = true;
                } else if (taxVal === 0) {
                    layer3.status = "FAIL";
                    layer3.details.push("Thuế NK 0%: Thuộc danh mục quản lý rủi ro chênh lệch thuế suất (FTA/ATIGA/ACFTA). Yêu cầu văn bản giải trình xuất xứ.");
                    isBlocked = true;
                } else {
                    layer3.details.push(`Thuế NK ${taxVal}% (BT2026 options: ${currentTaxOptions.map(r => r + '%').join(' / ')}). Tiền thuế = ${importDutyAmount.toLocaleString(undefined, {maximumFractionDigits: 2})} USD.`);
                }

                if (isNaN(vatVal) || !currentVatOptions.includes(vatVal)) {
                    layer3.status = "FAIL";
                    layer3.details.push(`Thuế suất VAT [${formData.vatRate}] không hợp lệ với mã HS này. Chỉ cho phép: ${currentVatOptions.map(v => v + '%').join(' / ')}.`);
                    isBlocked = true;
                } else {
                    layer3.details.push(`Thuế GTGT (VAT) ${vatVal}% hợp lệ. Tiền VAT = ${vatAmount.toLocaleString(undefined, {maximumFractionDigits: 2})} USD.`);
                }

                const priceVal = parseFloat(formData.unitPrice);
                const qtyVal = parseFloat(formData.qty);
                if (isNaN(priceVal) || priceVal <= 0) {
                    layer3.status = "FAIL";
                    layer3.details.push("Đơn giá phải là số dương (> 0). Bắt buộc nhập để tính trị giá CIF.");
                    isBlocked = true;
                }
                if (isNaN(qtyVal) || qtyVal <= 0) {
                    layer3.status = "FAIL";
                    layer3.details.push("Số lượng phải là số dương (> 0). Bắt buộc nhập để tính trị giá CIF.");
                    isBlocked = true;
                }

                const layer4 = { name: "Tầng 4: Từ Khóa Nhạy Cảm & Mô Tả 4 Thành Phần", status: "PASS", details: [] };
                const nameLower = normalizeVN(formData.itemName);
                const matchedKw = sensitiveKeywords.filter(kw => nameLower.includes(normalizeVN(kw)));

                if (matchedKw.length > 0) {
                    layer4.status = "FAIL";
                    layer4.details.push(`Phát hiện từ khóa nhạy cảm/mơ hồ: [${matchedKw.join(', ')}].`);
                    isBlocked = true;
                } else {
                    layer4.details.push("Không chứa từ khóa mơ hồ thuộc danh mục cảnh báo.");
                }

                const hasModel = /model|mã|type|code|kích thước|dày\s*\d|\d+\s*mm|\d+\s*cm|khổ\s*\d/i.test(formData.itemName);
                const hasMaterial = /gỗ|tre|nứa|thông|sồi|tếch|bạch đàn|cao su|dừa|tràm|keo|mùn cưa|dăm|gáo|vỏ|Pinus|Quercus|Tectona|Acacia|Hevea|Betula|Populus|Abies|Picea|Fagus/i.test(formData.itemName);
                const hasFunction = /nhiên liệu|đốt|nén|ép|xẻ|cưa|bào|chà nhám|nghiền|sản xuất|chế biến|đóng gói|viên|khối|dùng|làm|ván|nội thất|đóng tàu/i.test(formData.itemName);

                const missingComponents = [];
                if (!hasMaterial) missingComponents.push("Chất liệu/Loài gỗ");
                if (!hasFunction) missingComponents.push("Công dụng/Chức năng");
                if (!hasModel) missingComponents.push("Model/Thông số kỹ thuật");

                if (missingComponents.length > 0) {
                    if (missingComponents.length >= 2) { layer4.status = "FAIL"; isBlocked = true; }
                    else { layer4.status = layer4.status === "FAIL" ? "FAIL" : "WARN"; }
                    layer4.details.push(`Mô tả chưa đủ 4 thành phần SOP. Thiếu: [${missingComponents.join(', ')}].`);
                } else {
                    layer4.details.push("Mô tả đạt chuẩn 4 thành phần SOP.");
                }

                return { isBlocked, layers: [layer0, layer1, layer2, layer3, layer4] };
            }, [formData, hsLookup, nameHsSemantic, sensitiveKeywords, importDutyAmount, vatAmount, currentTaxOptions, currentVatOptions, nameConfirmed]);

            const currentInspection = inspectRules();

            const hasRequiredFields =
                formData.decNo.trim() &&
                formData.itemName.trim() &&
                formData.hsDeclared.trim() &&
                formData.importTax !== '' &&
                formData.vatRate !== '' &&
                formData.unitPrice !== '' &&
                formData.qty !== '';

            const canTransmit = hasRequiredFields && !currentInspection.isBlocked;
            const finalStatus = currentInspection.isBlocked ? "BLOCKED" : "PASSED";

            const pendingOverrideCount = overrideRequests.filter(r => r.status === 'PENDING').length;
            const approvedOverrideCount = overrideRequests.filter(r => r.status === 'APPROVED').length;

            const handleSubmitOverrideRequest = (overrideForm) => {
                setOverrideModalOpen(false);
                const snapshot = {
                    decNo: formData.decNo,
                    sku: formData.sku,
                    itemName: formData.itemName,
                    hsDeclared: formData.hsDeclared,
                    importTax: formData.importTax,
                    vatRate: formData.vatRate,
                    unitPrice: formData.unitPrice,
                    qty: formData.qty,
                    cifValue, importDutyAmount, vatAmount, totalTaxAmount,
                    hsDescription: hsLookup.ref ? hsLookup.ref.desc : '',
                    unit: hsLookup.ref ? hsLookup.ref.unit : '',
                    mfn: hsLookup.ref ? hsLookup.ref.mfn : null,
                    normal: hsLookup.ref ? hsLookup.ref.normal : null,
                    blockedLayers: currentInspection.layers
                        .filter(l => l.status === 'FAIL')
                        .map(l => ({ name: l.name, details: [...l.details] }))
                };
                const newOverride = {
                    id: `OVR-${Math.floor(1000 + Math.random() * 9000)}`,
                    status: 'PENDING',
                    ...snapshot,
                    reason: overrideForm.reason,
                    girRule: overrideForm.girRule,
                    fileName: overrideForm.fileName,
                    fileMeta: overrideForm.fileMeta,
                    fileBlob: overrideForm.fileBlob,
                    requestedAt: nowStr(),
                    requestedBy: 'Chuyên viên XNK',
                    approvedAt: null, approvedBy: null,
                    rejectedAt: null, rejectedBy: null,
                    transmittedAt: null, transmittedBy: null, declarationId: null
                };
                setOverrideRequests(prev => [newOverride, ...prev]);
                setFormData({ ...EMPTY_FORM });
                setNameConfirmed(false);
                setActiveTab('overrides');
                showToast(`Đã gửi phiếu ${newOverride.id} — đang chờ Trưởng phòng phê duyệt`, "success");
            };

            const handleApproveOverride = (id) => {
                setOverrideRequests(prev => prev.map(r => r.id === id ? {
                    ...r,
                    status: 'APPROVED',
                    approvedAt: nowStr(),
                    approvedBy: 'Trưởng Phòng Logistics'
                } : r));
                showToast("Đã phê duyệt — Chuyên viên XNK có thể truyền tờ khai", "success");
            };

            const handleRejectOverride = (id) => {
                setOverrideRequests(prev => prev.map(r => r.id === id ? {
                    ...r,
                    status: 'REJECTED',
                    rejectedAt: nowStr(),
                    rejectedBy: 'Trưởng Phòng Logistics'
                } : r));
                showToast("Đã từ chối phiếu yêu cầu", "error");
            };

            const handleOpenTransmitOverride = (id) => {
                setTransmitOverrideId(id);
                setTransmitModalOpen(true);
                setViewingOverride(null);
            };

            const handleDownloadOverrideFile = (override) => {
                if (!override || !override.fileBlob) return;
                const url = URL.createObjectURL(override.fileBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = override.fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                showToast("Đang tải file về máy...", "info");
            };

            const confirmTransmit = () => {
                setTransmitModalOpen(false);

                if (transmitOverrideId) {
                    const override = overrideRequests.find(r => r.id === transmitOverrideId);
                    if (!override) { setTransmitOverrideId(null); return; }

                    const newDec = {
                        id: `DEC-${Math.floor(1000 + Math.random() * 9000)}`,
                        decNo: override.decNo,
                        sku: override.sku,
                        itemName: override.itemName,
                        hsDeclared: override.hsDeclared,
                        status: 'APPROVED_OVERRIDE',
                        createdAt: nowStr(),
                        approvedBy: "Manager Approved",
                        importTax: override.importTax,
                        vatRate: override.vatRate,
                        unitPrice: override.unitPrice,
                        qty: override.qty,
                        cifValue: override.cifValue,
                        importDutyAmount: override.importDutyAmount,
                        vatAmount: override.vatAmount,
                        totalTaxAmount: override.totalTaxAmount,
                        overrideReason: override.reason,
                        girRule: override.girRule,
                        hsDescription: override.hsDescription,
                        unit: override.unit,
                        mfn: override.mfn,
                        normal: override.normal,
                        transmittedBy: 'Chuyên viên XNK',
                        overrideId: override.id
                    };
                    setDeclarations(prev => [newDec, ...prev]);
                    setOverrideRequests(prev => prev.map(r => r.id === override.id ? {
                        ...r,
                        status: 'TRANSMITTED',
                        transmittedAt: nowStr(),
                        transmittedBy: 'Chuyên viên XNK',
                        declarationId: newDec.id
                    } : r));
                    setTransmitOverrideId(null);
                    showToast(`Tờ khai ${override.decNo} đã được truyền thành công tới VNACCS!`, "success");
                    return;
                }

                const newDec = {
                    id: `DEC-${Math.floor(1000 + Math.random() * 9000)}`,
                    decNo: formData.decNo,
                    sku: formData.sku,
                    itemName: formData.itemName,
                    hsDeclared: formData.hsDeclared,
                    status: finalStatus,
                    createdAt: nowStr(),
                    approvedBy: "System Auto Passed",

            const [girRule, setGirRule] = React.useState('GIR 3(b)');
            const [reason, setReason] = React.useState('');
            const [attachedFile, setAttachedFile] = React.useState(null);
            const fileInputRef = React.useRef(null);

            const handleFileSelect = (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                if (file.size > 10 * 1024 * 1024) {
                    alert("File quá lớn. Vui lòng chọn file dưới 10MB.");
                    return;
                }
                setAttachedFile({
                    name: file.name,
                    size: file.size,
                    type: file.type,
                    lastModified: file.lastModified,
                    blob: file
                });
            };

            const handleRemoveFile = () => {
                setAttachedFile(null);
                if (fileInputRef.current) fileInputRef.current.value = '';
            };

            const formatSize = (bytes) => {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!reason.trim()) {
                    alert("Vui lòng nhập nội dung giải trình kỹ thuật");
                    return;
                }
                onSubmit({
                    girRule,
                    reason,
                    fileName: attachedFile ? attachedFile.name : 'Chưa đính kèm',
                    fileMeta: attachedFile,
                    fileBlob: attachedFile ? attachedFile.blob : null
                });
            };

            const cifDisplay = (parseFloat(currentFormData.unitPrice) || 0) * (parseFloat(currentFormData.qty) || 0);

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-2xl max-w-lg w-full p-6 space-y-5 shadow-2xl max-h-[92vh] overflow-y-auto">
                        <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                            <div>
                                <h3 className="font-bold text-slate-900 text-base">Phiếu Yêu Cầu Phê Duyệt Mở Khóa Ngoại Lệ HS</h3>
                                <p className="text-xs text-slate-500">Toàn bộ dữ liệu tờ khai (HS, thuế, giá, SL) sẽ được đính kèm tự động vào phiếu</p>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 font-bold text-lg">×</button>
                        </div>

                        {/* ✅ ĐÃ FIX: Hiển thị đầy đủ Đơn giá, Số lượng, Trị giá CIF */}
                        <div className="p-3 bg-slate-50 border border-slate-200 rounded-xl text-[11px] text-slate-700 space-y-1">
                            <p><span className="text-slate-500">Tờ khai:</span> <b className="font-mono">{currentFormData.decNo || '—'}</b></p>
                            <p><span className="text-slate-500">Tên hàng:</span> <b>{currentFormData.itemName || '—'}</b></p>
                            <p><span className="text-slate-500">Mã HS:</span> <b className="font-mono text-blue-700">{currentFormData.hsDeclared || '—'}</b></p>
                            <p>
                                <span className="text-slate-500">Thuế NK:</span> <b className="text-amber-700">{showVal(currentFormData.importTax)}%</b>
                                {' · '}
                                <span className="text-slate-500">VAT:</span> <b className="text-indigo-700">{showVal(currentFormData.vatRate)}%</b>
                            </p>
                            <p>
                                <span className="text-slate-500">Đơn giá:</span> <b className="font-mono">${showVal(currentFormData.unitPrice)}</b>
                                {' · '}
                                <span className="text-slate-500">Số lượng:</span> <b className="font-mono">{showVal(currentFormData.qty)}</b>
                            </p>
                            <p>
                                <span className="text-slate-500">Trị giá CIF:</span>{' '}
                                <b className="font-mono">${cifDisplay.toLocaleString(undefined, { maximumFractionDigits: 2 })}</b>
                            </p>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Căn Cứ Quy Tắc Giải Thích HS (GIR Rules)</label>
                                <select value={girRule} onChange={(e) => setGirRule(e.target.value)}
                                    className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 font-medium">
                                    <option value="GIR 1">Quy tắc 1: Căn cứ Chú giải Chương/Phần & Tên Nhóm</option>
                                    <option value="GIR 2(a)">Quy tắc 2(a): Hàng chưa hoàn chỉnh/tháo rời</option>
                                    <option value="GIR 3(a)">Quy tắc 3(a): Chọn Nhóm có mô tả cụ thể nhất</option>
                                    <option value="GIR 3(b)">Quy tắc 3(b): Chọn theo Đặc tính cơ bản cấu thành (Essential Character)</option>
                                    <option value="GIR 3(c)">Quy tắc 3(c): Chọn Nhóm có thứ tự cuối cùng</option>
                                    <option value="GIR 6">Quy tắc 6: Phân loại ở cấp Phân nhóm 6-8 chữ số</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Nội Dung Giải Trình Kỹ Thuật Chi Tiết <span className="text-rose-500">*</span></label>
                                <textarea rows="4" value={reason} onChange={(e) => setReason(e.target.value)} required
                                    className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-slate-800"
                                    placeholder="Nêu rõ thành phần %, tài liệu catalog, chức năng chính..." />
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">
                                    Đính Kèm Tài Liệu Kỹ Thuật (Catalog / TDS / COA)
                                </label>
                                <input
                                    ref={fileInputRef}
                                    type="file"
                                    onChange={handleFileSelect}
                                    accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.gif,.txt,.csv"
                                    className="hidden"
                                />

                                {!attachedFile ? (
                                    <button
                                        type="button"
                                        onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                        className="w-full p-4 border-2 border-dashed border-slate-300 hover:border-blue-400 hover:bg-blue-50/40 rounded-xl flex flex-col items-center justify-center gap-2 text-xs bg-slate-50 transition cursor-pointer group">
                                        <span className="text-slate-400 group-hover:text-blue-500 transition"><Icons.Upload /></span>
                                        <span className="font-semibold text-slate-600 group-hover:text-blue-700">
                                            Bấm để chọn file đính kèm
                                        </span>
                                        <span className="text-[10px] text-slate-400">
                                            PDF, Word, Excel, ảnh — tối đa 10MB
                                        </span>
                                    </button>
                                ) : (
                                    <div className="p-3 border-2 border-emerald-300 bg-emerald-50/40 rounded-xl flex items-center justify-between gap-3">
                                        <div className="flex items-center gap-2 min-w-0 flex-1">
                                            <div className="p-2 bg-emerald-100 text-emerald-600 rounded-lg shrink-0">
                                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1.001 1.001 0 01.707.293l5.414 5.414a1.001 1.001 0 01.293.707V19a2 2 0 01-2 2z" />
                                                </svg>
                                            </div>
                                            <div className="min-w-0 flex-1">
                                                <p className="font-mono text-xs font-semibold text-slate-800 truncate" title={attachedFile.name}>
                                                    {attachedFile.name}
                                                </p>
                                                <p className="text-[10px] text-slate-500">{formatSize(attachedFile.size)}</p>
                                            </div>
                                        </div>
                                        <button
                                            type="button"
                                            onClick={handleRemoveFile}
                                            className="p-1.5 text-rose-500 hover:bg-rose-100 rounded-lg transition shrink-0"
                                            title="Xóa file">
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                                            </svg>
                                        </button>
                                    </div>
                                )}
                            </div>

                            <div className="pt-3 border-t border-slate-100 flex space-x-3">
                                <button type="button" onClick={onClose}
                                    className="flex-1 py-2.5 border border-slate-300 text-slate-700 rounded-xl font-bold text-xs hover:bg-slate-50 transition">Hủy Bỏ</button>
                                <button type="submit"
                                    className="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xs shadow-lg shadow-indigo-100 transition">
                                    Gửi Trưởng Phòng Phê Duyệt
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

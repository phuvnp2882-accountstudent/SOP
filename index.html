            '44072982': /mengkulang|heritiera/i, '44072983': /mengkulang|heritiera/i, '44072989': /mengkulang|heritiera/i,
            '44072991': /jongkong|merbau|dactylocladus|intsia/i,
            '44072992': /jongkong|merbau|dactylocladus|intsia/i,
            '44072994': /albizia|falcataria/i, '44072995': /albizia|falcataria/i,
            '44072996': /cao su|hevea|rubber/i, '44072997': /cao su|hevea|rubber/i,
            '44079120': /sồi|quercus/i, '44079130': /sồi|quercus/i, '44079190': /sồi|quercus/i,
            '44079210': /dẻ gai|fagus/i, '44079290': /dẻ gai|fagus/i,
            '44079310': /thích|acer|maple/i, '44079390': /thích|acer|maple/i,
            '44079410': /anh đào|prunus|cherry/i, '44079490': /anh đào|prunus|cherry/i,
            '44079510': /tần bì|fraxinus|ash/i, '44079590': /tần bì|fraxinus|ash/i,
            '44079610': /bạch dương|betula|birch/i, '44079690': /bạch dương|betula|birch/i,
            '44079710': /dương|populus|poplar|aspen/i, '44079790': /dương|populus|poplar|aspen/i
        };

        const DEFAULT_TAX_OPTIONS = [0, 3, 5, 8, 10, 15, 20];
        const INITIAL_KEYWORDS = ["đa năng", "tổng hợp", "hỗn hợp", "kết hợp", "tích hợp", "chế phẩm", "linh kiện", "bộ", "hệ thống", "tháo rời", "phụ tùng", "pha trộn", "đa loại"];

        const EMPTY_FORM = {
            decNo: '', sku: '', itemName: '', hsDeclared: '',
            importTax: '', vatRate: 10, unitPrice: '', qty: '',
            overrideApproved: false, overrideReason: '', girRule: ''
        };

        const normalizeHS = (code) => (code || '').toString().replace(/[.\s]/g, '').trim();
        const formatHS = (code8) => code8.replace(/(\d{4})(\d{2})(\d{2})/, "$1.$2.$3");
        const normalizeVN = (s) => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();

        function App() {
            const [userRole, setUserRole] = React.useState('STAFF');
            const [activeTab, setActiveTab] = React.useState('create');
            const [sensitiveKeywords, setSensitiveKeywords] = React.useState(INITIAL_KEYWORDS);
            const [newKeywordInput, setNewKeywordInput] = React.useState('');
            const [formData, setFormData] = React.useState({ ...EMPTY_FORM });
            const [nameConfirmed, setNameConfirmed] = React.useState(false);
            const [declarations, setDeclarations] = React.useState([]);
            const [overrideModalOpen, setOverrideModalOpen] = React.useState(false);
            const [transmitModalOpen, setTransmitModalOpen] = React.useState(false);
            const [toast, setToast] = React.useState(null);
            const toastTimerRef = React.useRef(null);

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                toastTimerRef.current = setTimeout(() => setToast(null), 3500);
            };

            // ===== TRA CỨU MÃ HS TRONG BT2026 =====
            const hsLookup = React.useMemo(() => {
                const key = normalizeHS(formData.hsDeclared);
                if (!key) return { status: 'EMPTY', ref: null, key };
                const ref = BT2026_REFERENCE[key];
                return ref ? { status: 'FOUND', ref, key } : { status: 'NOT_FOUND', ref: null, key };
            }, [formData.hsDeclared]);

            // ===== VAT OPTIONS ĐỘNG THEO MÃ HS =====
            const currentVatOptions = React.useMemo(() => {
                return hsLookup.status === 'FOUND' ? getVatOptions(hsLookup.ref) : DEFAULT_VAT_OPTIONS;
            }, [hsLookup]);

            // ===== ĐỐI CHIẾU NGỮ NGHĨA: TÊN HÀNG ↔ MÃ HS =====
            const nameHsSemantic = React.useMemo(() => {
                if (!formData.itemName || hsLookup.status !== 'FOUND') {
                    return { status: 'SKIP', details: [] };
                }
                const name = normalizeVN(formData.itemName);
                const code8 = hsLookup.key;
                const heading4 = code8.substring(0, 4);
                const heading = HEADING_PATTERNS[heading4];
                const species = SPECIES_PATTERNS[code8];
                const headingMatched = heading ? heading.pattern.test(name) : true;
                const speciesMatched = species ? species.test(name) : true;

                const details = [];
                if (heading && !headingMatched) {
                    details.push(`Tên hàng không đề cập loại sản phẩm của nhóm ${heading4} — cần có: "${heading.label}".`);
                }
                if (species && !speciesMatched) {
                    details.push(`Mã HS ${code8} yêu cầu loài cây cụ thể nhưng tên hàng không đề cập loài tương ứng.`);
                }
                if (headingMatched && speciesMatched) {
                    details.push(`Tên hàng khớp mô tả loại sản phẩm ${heading ? `nhóm ${heading4}` : ''}${species ? ` và loài cây` : ''}.`);
                }
                return {
                    status: headingMatched && speciesMatched ? 'MATCH' : 'MISMATCH',
                    details
                };
            }, [formData.itemName, hsLookup]);

            // ===== TÍNH TOÁN THUẾ =====
            const cifValue = (parseFloat(formData.unitPrice) || 0) * (parseFloat(formData.qty) || 0);
            const importTaxRate = parseFloat(formData.importTax) || 0;
            const vatRate = parseFloat(formData.vatRate) || 0;
            const importDutyAmount = cifValue * (importTaxRate / 100);
            const vatBase = cifValue + importDutyAmount;
            const vatAmount = vatBase * (vatRate / 100);
            const totalTaxAmount = importDutyAmount + vatAmount;

            const currentTaxOptions = React.useMemo(() => {
                if (hsLookup.status !== 'FOUND') return DEFAULT_TAX_OPTIONS;
                const { mfn, normal } = hsLookup.ref;
                const opts = [...new Set([0, mfn, normal])].sort((a, b) => a - b);
                const cur = parseFloat(formData.importTax);
                if (!isNaN(cur) && !opts.includes(cur)) opts.push(cur);
                return opts.sort((a, b) => a - b);
            }, [hsLookup, formData.importTax]);

            const hsInputClass = (() => {
                const base = "w-full pl-9 pr-9 py-2 text-sm font-mono rounded-lg focus:outline-none focus:ring-2 transition-all font-semibold ";
                if (!nameConfirmed) return base + "border border-slate-200 bg-slate-100 text-slate-400 cursor-not-allowed";
                if (hsLookup.status === 'FOUND') return base + "border border-emerald-400 bg-emerald-50 text-emerald-800 focus:ring-emerald-500";
                if (hsLookup.status === 'NOT_FOUND') return base + "border border-rose-400 bg-rose-50 text-rose-800 focus:ring-rose-500";
                return base + "border border-slate-300 text-blue-700 focus:ring-blue-500";
            })();

            const handleHsChange = (newHS) => {
                if (!nameConfirmed) {
                    showToast("Vui lòng xác nhận tên hàng trước khi nhập mã HS", "error");
                    return;
                }
                const key = normalizeHS(newHS);
                const ref = BT2026_REFERENCE[key];
                if (ref) {
                    const opts = getVatOptions(ref);
                    const currentVat = parseFloat(formData.vatRate);
                    const newVat = opts.includes(currentVat) ? currentVat : ref.vat;
                    setFormData(prev => ({
                        ...prev,
                        hsDeclared: newHS,
                        importTax: ref.mfn,
                        vatRate: String(newVat),
                        overrideApproved: false
                    }));
                } else {
                    setFormData(prev => ({
                        ...prev,
                        hsDeclared: newHS,
                        importTax: '',
                        vatRate: '8',
                        overrideApproved: false
                    }));
                }
            };

            const handleItemNameChange = (newName) => {
                const wasConfirmed = nameConfirmed;
                setFormData(prev => ({
                    ...prev,
                    itemName: newName,
                    hsDeclared: '',
                    importTax: '',
                    vatRate: 8,
                    overrideApproved: false
                }));
                if (wasConfirmed) {
                    setNameConfirmed(false);
                    showToast("Tên hàng đã thay đổi — mã HS đã được xoá, vui lòng xác nhận lại", "info");
                }
            };

            const handleConfirmName = () => {
                if (!formData.itemName || !formData.itemName.trim()) {
                    showToast("Vui lòng nhập tên hàng hóa trước khi xác nhận", "error");
                    return;
                }
                setNameConfirmed(true);
                showToast("Đã xác nhận tên hàng — mời nhập mã HS", "success");
            };

            const handleUnlockName = () => {
                setNameConfirmed(false);
                setFormData(prev => ({ ...prev, hsDeclared: '', importTax: '', vatRate: 8, overrideApproved: false }));
                showToast("Đã mở khóa tên hàng — sửa xong nhớ xác nhận lại", "info");
            };

            // ===== 5 TẦNG KIỂM TRA =====
            const inspectRules = React.useCallback(() => {
                let isBlocked = false;

                // TẦNG 0
                const layer0 = { name: "Tầng 0: Xác Nhận Tên Hàng Trước Khi Tra Cứu", status: "PASS", details: [] };
                if (nameConfirmed) {
                    layer0.details.push("✓ Tên hàng đã được người dùng xác nhận — cho phép tra cứu mã HS.");
                } else {
                    layer0.status = "FAIL";
                    layer0.details.push("Chưa xác nhận tên hàng. Vui lòng nhấn nút 'Xác nhận & Tra mã HS' trước khi nhập mã HS.");
                    layer0.details.push("Nếu sửa lại tên hàng, mã HS cũ sẽ bị xoá và phải xác nhận lại.");
                    isBlocked = true;
                }

                // TẦNG 1
                const layer1 = { name: "Tầng 1: Tra Cứu Mã HS Trong BT2026", status: "PASS", details: [] };
                if (hsLookup.status === 'EMPTY') {
                    layer1.status = "FAIL";
                    layer1.details.push("Chưa nhập mã HS (8 số). Bắt buộc khai báo mã HS để tra cứu biểu thuế BT2026.");
                    isBlocked = true;
                } else if (hsLookup.status === 'NOT_FOUND') {
                    layer1.status = "FAIL";
                    layer1.details.push(`Mã HS [${formData.hsDeclared}] không có trong bảng tham chiếu BT2026 (nhóm 4401-4407).`);
                    isBlocked = true;
                } else {
                    layer1.details.push(`✓ Tra cứu thành công mã HS trong BT2026.`);
                    layer1.details.push(`VAT cho phép: ${currentVatOptions.map(v => v + '%').join(' / ')}.`);
                }

                // TẦNG 2
                const layer2 = { name: "Tầng 2: Đối Chiếu Tên Hàng ↔ Mô Tả Mã HS", status: "PASS", details: [] };
                if (nameHsSemantic.status === 'SKIP') {
                    layer2.status = "WARN";
                    layer2.details.push("Chưa đủ dữ liệu để đối chiếu (cần cả tên hàng và mã HS hợp lệ).");
                } else if (nameHsSemantic.status === 'MISMATCH') {
                    layer2.status = "FAIL";
                    layer2.details.push("⚠️ Tên hàng hóa KHÔNG khớp với mô tả của mã HS đã chọn — chặn truyền tờ khai.");
                    nameHsSemantic.details.forEach(d => layer2.details.push(d));
                    isBlocked = true;
                } else {
                    nameHsSemantic.details.forEach(d => layer2.details.push(d));
                }

                // TẦNG 3
                const layer3 = { name: "Tầng 3: Kiểm Tra Thuế NK & Thuế GTGT (BT2026)", status: "PASS", details: [] };
                const taxVal = parseFloat(formData.importTax);
                const vatVal = parseFloat(formData.vatRate);

                if (hsLookup.status !== 'FOUND') {
                    layer3.status = "FAIL";
                    layer3.details.push("Chưa xác thực mã HS → không thể đối chiếu thuế suất theo BT2026.");
                    isBlocked = true;
                } else if (isNaN(taxVal)) {
                    layer3.status = "FAIL";
                    layer3.details.push("Chưa chọn Thuế suất Nhập khẩu. Bắt buộc chọn mức thuế theo BT2026.");
                    isBlocked = true;
                } else if (taxVal === 0) {
                    layer3.status = "FAIL";
                    layer3.details.push("Thuế NK 0%: Thuộc danh mục quản lý rủi ro chênh lệch thuế suất (FTA/ATIGA/ACFTA). Yêu cầu văn bản giải trình xuất xứ.");
                    isBlocked = true;
                } else {
                    layer3.details.push(`Thuế NK ${taxVal}% (BT2026 options: ${currentTaxOptions.map(r => r + '%').join(' / ')}). Tiền thuế = ${importDutyAmount.toLocaleString(undefined, {maximumFractionDigits: 2})} USD.`);
                }

                if (isNaN(vatVal) || !currentVatOptions.includes(vatVal)) {
                    layer3.status = "FAIL";
                    layer3.details.push(`Thuế suất VAT [${formData.vatRate}] không hợp lệ với mã HS này. Chỉ cho phép: ${currentVatOptions.map(v => v + '%').join(' / ')}.`);
                    isBlocked = true;
                } else {
                    layer3.details.push(`Thuế GTGT (VAT) ${vatVal}% hợp lệ. Tiền VAT = ${vatAmount.toLocaleString(undefined, {maximumFractionDigits: 2})} USD.`);
                }

                const priceVal = parseFloat(formData.unitPrice);
                const qtyVal = parseFloat(formData.qty);
                if (isNaN(priceVal) || priceVal <= 0) {
                    layer3.status = "FAIL";
                    layer3.details.push("Đơn giá phải là số dương (> 0). Bắt buộc nhập để tính trị giá CIF.");
                    isBlocked = true;
                }
                if (isNaN(qtyVal) || qtyVal <= 0) {
                    layer3.status = "FAIL";
                    layer3.details.push("Số lượng phải là số dương (> 0). Bắt buộc nhập để tính trị giá CIF.");
                    isBlocked = true;
                }

                // TẦNG 4
                const layer4 = { name: "Tầng 4: Từ Khóa Nhạy Cảm & Mô Tả 4 Thành Phần", status: "PASS", details: [] };
                const nameLower = normalizeVN(formData.itemName);
                const matchedKw = sensitiveKeywords.filter(kw => nameLower.includes(normalizeVN(kw)));

                if (matchedKw.length > 0) {
                    layer4.status = "FAIL";
                    layer4.details.push(`Phát hiện từ khóa nhạy cảm/mơ hồ: [${matchedKw.join(', ')}].`);
                    isBlocked = true;
                } else {
                    layer4.details.push("Không chứa từ khóa mơ hồ thuộc danh mục cảnh báo.");
                }

                const hasModel = /model|mã|type|code|kích thước|dày\s*\d|\d+\s*mm|\d+\s*cm|khổ\s*\d/i.test(formData.itemName);
                const hasMaterial = /gỗ|tre|nứa|thông|sồi|tếch|bạch đàn|cao su|dừa|tràm|keo|mùn cưa|dăm|gáo|vỏ|Pinus|Quercus|Tectona|Acacia|Hevea|Betula|Populus|Abies|Picea|Fagus/i.test(formData.itemName);
                const hasFunction = /nhiên liệu|đốt|nén|ép|xẻ|cưa|bào|chà nhám|nghiền|sản xuất|chế biến|đóng gói|viên|khối|dùng|làm|ván|nội thất|đóng tàu/i.test(formData.itemName);

                const missingComponents = [];
                if (!hasMaterial) missingComponents.push("Chất liệu/Loài gỗ");
                if (!hasFunction) missingComponents.push("Công dụng/Chức năng");
                if (!hasModel) missingComponents.push("Model/Thông số kỹ thuật");

                if (missingComponents.length > 0) {
                    if (missingComponents.length >= 2) { layer4.status = "FAIL"; isBlocked = true; }
                    else { layer4.status = layer4.status === "FAIL" ? "FAIL" : "WARN"; }
                    layer4.details.push(`Mô tả chưa đủ 4 thành phần SOP. Thiếu: [${missingComponents.join(', ')}].`);
                } else {
                    layer4.details.push("Mô tả đạt chuẩn 4 thành phần SOP.");
                }

                return { isBlocked, layers: [layer0, layer1, layer2, layer3, layer4] };
            }, [formData, hsLookup, nameHsSemantic, sensitiveKeywords, importDutyAmount, vatAmount, currentTaxOptions, currentVatOptions, nameConfirmed]);

            const currentInspection = inspectRules();
            const isOverrideApproved = formData.overrideApproved === true;

            const hasRequiredFields =
                formData.decNo.trim() &&
                formData.sku.trim() &&
                formData.itemName.trim() &&
                formData.hsDeclared.trim() &&
                formData.importTax !== '' &&
                formData.vatRate !== '' &&
                formData.unitPrice !== '' &&
                formData.qty !== '';

            const canTransmit = hasRequiredFields && (isOverrideApproved || !currentInspection.isBlocked);

            const finalStatus = isOverrideApproved ? "APPROVED_OVERRIDE" : (currentInspection.isBlocked ? "BLOCKED" : "PASSED");

            const handleRequestOverride = (overrideForm) => {
                setFormData(prev => ({ ...prev, overrideApproved: true, overrideReason: overrideForm.reason, girRule: overrideForm.girRule }));
                setOverrideModalOpen(false);
                showToast("Đã phê duyệt mở khóa ngoại lệ thành công!", "success");
            };

            const confirmTransmit = () => {
                setTransmitModalOpen(false);
                const newDec = {
                    id: `DEC-${Math.floor(1000 + Math.random() * 9000)}`,
                    decNo: formData.decNo, sku: formData.sku, itemName: formData.itemName,
                    hsDeclared: formData.hsDeclared, status: finalStatus,
                    createdAt: new Date().toISOString().replace('T', ' ').substring(0, 16),
                    approvedBy: isOverrideApproved ? "Manager Approved" : "System Auto Passed"
                };
                setDeclarations(prev => [newDec, ...prev]);
                showToast(`Tờ khai ${formData.decNo} đã được truyền thành công tới VNACCS!`, "success");
            };

            const handleResetForm = () => {
                setFormData({ ...EMPTY_FORM });
                setNameConfirmed(false);
                showToast("Đã xoá toàn bộ form để tạo tờ khai mới", "info");
            };

            const isTaxEnabled = hsLookup.status === 'FOUND' && nameConfirmed;
            const isFormLocked = !nameConfirmed;

            return (
                <div className="min-h-screen flex flex-col bg-slate-100">
                    <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 shadow-md">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-16">
                                <div className="flex items-center space-x-3">
                                    <div className="p-2 bg-blue-600 text-white rounded-lg shadow-lg"><Icons.ShieldCheck /></div>
                                    <div>
                                        <h1 className="font-bold text-lg leading-tight tracking-wide text-white">HS COMPLIANCE GATE</h1>
                                        <p className="text-xs text-blue-300 font-medium">Hệ Thống Khóa Luồng Cảnh Báo Mã HS Tự Động (SOP Logistics)</p>
                                    </div>
                                </div>
                                <div className="flex items-center space-x-4">
                                    <div className="bg-slate-800 border border-slate-700 p-1 rounded-xl flex items-center text-xs">
                                        <span className="text-slate-400 px-2 font-medium">Vai trò:</span>
                                        <button onClick={() => { setUserRole('STAFF'); showToast("Chuyển sang vai trò Chuyên viên XNK", "info"); }}
                                            className={`px-3 py-1.5 rounded-lg font-semibold transition-all ${userRole === 'STAFF' ? 'bg-blue-600 text-white shadow' : 'text-slate-300 hover:text-white'}`}>👨‍💼 Chuyên viên XNK</button>
                                        <button onClick={() => { setUserRole('MANAGER'); showToast("Chuyển sang vai trò Trưởng phòng Logistics", "info"); }}
                                            className={`px-3 py-1.5 rounded-lg font-semibold transition-all ${userRole === 'MANAGER' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:text-white'}`}>🛡️ Trưởng Phòng Logistics</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div className="bg-slate-800/80 backdrop-blur border-t border-slate-700 px-4 sm:px-6 lg:px-8">
                            <div className="max-w-7xl mx-auto flex space-x-1">
                                <button onClick={() => setActiveTab('create')}
                                    className={`flex items-center space-x-2 px-4 py-3 text-sm font-medium border-b-2 transition-colors ${activeTab === 'create' ? 'border-blue-500 text-blue-400 bg-slate-900/50' : 'border-transparent text-slate-400 hover:text-slate-200'}`}><Icons.FileText /><span>Tạo & Kiểm Tra Tờ Khai</span></button>
                                <button onClick={() => setActiveTab('list')}
                                    className={`flex items-center space-x-2 px-4 py-3 text-sm font-medium border-b-2 transition-colors ${activeTab === 'list' ? 'border-blue-500 text-blue-400 bg-slate-900/50' : 'border-transparent text-slate-400 hover:text-slate-200'}`}><Icons.Layers /><span>Danh Sách Tờ Khai ({declarations.length})</span></button>
                                <button onClick={() => setActiveTab('config')}
                                    className={`flex items-center space-x-2 px-4 py-3 text-sm font-medium border-b-2 transition-colors ${activeTab === 'config' ? 'border-blue-500 text-blue-400 bg-slate-900/50' : 'border-transparent text-slate-400 hover:text-slate-200'}`}><Icons.Settings /><span>Cấu Hình Rule Engine</span></button>
                            </div>
                        </div>
                    </header>

                    {toast && (
                        <div className="fixed top-20 right-6 z-50">
                            <div className={`px-4 py-3 rounded-xl shadow-xl text-white font-medium text-sm flex items-center space-x-2 ${toast.type === 'success' ? 'bg-emerald-600' : toast.type === 'error' ? 'bg-rose-600' : 'bg-blue-600'}`}>
                                <Icons.CheckCircle /><span>{toast.message}</span>
                            </div>
                        </div>
                    )}

                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
                        {activeTab === 'create' && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                                    <div className="lg:col-span-7 space-y-6">
                                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-5">
                                            <div className="border-b border-slate-100 pb-4 flex justify-between items-center">
                                                <div>
                                                    <h2 className="text-base font-bold text-slate-900">Tờ Khai Hải Quan Nháp (Draft Declaration)</h2>
                                                    <p className="text-xs text-slate-500">Nhập dữ liệu hàng hóa để kiểm tra luồng cảnh báo tự động</p>
                                                </div>
                                                <div className="flex items-center gap-2">

                                                            {dec.status === 'PASSED' && (<span className="px-2.5 py-1 bg-emerald-100 text-emerald-800 rounded-full font-bold text-[10px]">PASSED</span>)}
                                                            {dec.status === 'APPROVED_OVERRIDE' && (<span className="px-2.5 py-1 bg-indigo-100 text-indigo-800 rounded-full font-bold text-[10px]">APPROVED OVERRIDE</span>)}
                                                            {dec.status === 'BLOCKED' && (<span className="px-2.5 py-1 bg-rose-100 text-rose-800 rounded-full font-bold text-[10px]">BLOCKED</span>)}
                                                        </td>
                                                        <td className="p-3 text-slate-400 font-mono text-[11px]">{dec.createdAt}</td>
                                                        <td className="p-3 text-slate-600 font-medium">{dec.approvedBy}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'config' && (
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-6">
                                <div>
                                    <h2 className="text-base font-bold text-slate-900">Quản Lý Bộ Quy Tắc Engine (Rule Configuration)</h2>
                                    <p className="text-xs text-slate-500">Tùy chỉnh Danh mục từ khóa nhạy cảm và Ngưỡng cảnh báo rủi ro thuế</p>
                                </div>

                                <div className="p-4 bg-blue-50 border border-blue-200 rounded-xl text-xs text-blue-800 space-y-1">
                                    <p className="font-bold">📋 5 tầng kiểm tra tự động:</p>
                                    <ol className="list-decimal pl-5 space-y-0.5">
                                        <li><b>Tầng 0</b> — Đã xác nhận tên hàng? (chưa → KHÓA, chặn nhập mã HS)</li>
                                        <li><b>Tầng 1</b> — Mã HS có tồn tại trong BT2026? (không → KHÓA)</li>
                                        <li><b>Tầng 2</b> — Tên hàng có khớp mô tả mã HS? (không → KHÓA — chặn truyền)</li>
                                        <li><b>Tầng 3</b> — Thuế NK & VAT hợp lệ với mã HS? + Đơn giá/SL &gt; 0 (vi phạm → KHÓA)</li>
                                        <li><b>Tầng 4</b> — Từ khóa mơ hồ & mô tả 4 thành phần SOP? (vi phạm ≥2 → KHÓA)</li>
                                    </ol>
                                    <p className="mt-1 pt-1 border-t border-blue-200 text-blue-700">
                                        <b>Điều kiện bật nút Truyền:</b> phải nhập đủ <b>Mã tờ khai, SKU, Tên hàng, Mã HS, Thuế NK, VAT, Đơn giá, Số lượng</b> và <b>không vi phạm bất kỳ tầng nào</b> (hoặc đã được duyệt ngoại lệ).
                                    </p>
                                </div>

                                <div className="space-y-3">
                                    <label className="block text-xs font-bold text-slate-800">Danh Mục Từ Khóa Nhạy Cảm / Mơ Hồ (Sensitive Keywords Filter)</label>
                                    <div className="flex space-x-2">
                                        <input type="text" value={newKeywordInput}
                                            onChange={(e) => setNewKeywordInput(e.target.value)}
                                            placeholder="Thêm từ khóa mới (ví dụ: pha trộn, đa loại, bán thành phẩm)..."
                                            className="flex-1 px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                                        <button onClick={() => {
                                            if (newKeywordInput.trim()) {
                                                setSensitiveKeywords([...sensitiveKeywords, newKeywordInput.trim()]);
                                                setNewKeywordInput('');
                                                showToast("Đã thêm từ khóa nhạy cảm mới!", "success");
                                            }
                                        }} className="px-4 py-2 bg-blue-600 text-white rounded-lg font-semibold text-xs hover:bg-blue-700 transition flex items-center space-x-1">
                                            <Icons.Plus /><span>Thêm Từ Khóa</span>
                                        </button>
                                    </div>
                                    <div className="flex flex-wrap gap-2 pt-2">
                                        {sensitiveKeywords.map((kw, idx) => (
                                            <span key={idx} className="px-3 py-1.5 bg-rose-50 border border-rose-200 text-rose-700 font-medium text-xs rounded-xl flex items-center space-x-2">
                                                <span>"{kw}"</span>
                                                <button onClick={() => {
                                                    setSensitiveKeywords(sensitiveKeywords.filter((_, i) => i !== idx));
                                                    showToast("Đã xóa từ khóa khỏi bộ lọc", "info");
                                                }} className="hover:text-rose-900 font-bold">×</button>
                                            </span>
                                        ))}
                                    </div>
                                </div>

                                <div className="border-t border-slate-100 pb-2"></div>

                                <div className="space-y-3">
                                    <div className="flex justify-between items-center">
                                        <h3 className="text-xs font-bold text-slate-800">
                                            Bảng Tham Chiếu BT2026 — Nhóm 4401-4407 (Gỗ & Lâm sản) · {Object.keys(BT2026_REFERENCE).length} mã
                                        </h3>
                                        <span className="text-[10px] text-slate-500 italic">Click vào dòng để nạp mã HS vào form</span>
                                    </div>
                                    <div className="overflow-x-auto max-h-96 overflow-y-auto border border-slate-200 rounded-lg">
                                        <table className="w-full text-left text-xs">
                                            <thead className="bg-slate-100 font-bold text-slate-700 sticky top-0">
                                                <tr>
                                                    <th className="p-2.5">Mã HS</th>
                                                    <th className="p-2.5">Mô tả chuẩn BT2026</th>
                                                    <th className="p-2.5">ĐVT</th>
                                                    <th className="p-2.5">NK TT (%)</th>
                                                    <th className="p-2.5">NK Ưu đãi (%)</th>
                                                    <th className="p-2.5">VAT (%)</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {Object.entries(BT2026_REFERENCE).map(([code, item]) => {
                                                    const formatted = formatHS(code);
                                                    const opts = getVatOptions(item);
                                                    return (
                                                        <tr key={code} className="hover:bg-slate-50 cursor-pointer"
                                                            onClick={() => {
                                                                setActiveTab('create');
                                                                setNameConfirmed(true);
                                                                handleHsChange(formatted);
                                                                showToast(`Đã điền mã HS ${formatted}`, "info");
                                                            }}>
                                                            <td className="p-2.5 font-bold font-mono text-blue-700">{formatted}</td>
                                                            <td className="p-2.5 text-slate-700">{item.desc}</td>
                                                            <td className="p-2.5 font-mono text-slate-500">{item.unit}</td>
                                                            <td className="p-2.5 font-mono text-slate-600">{item.normal}%</td>
                                                            <td className="p-2.5 font-bold text-amber-700">{item.mfn}%</td>
                                                            <td className="p-2.5 font-bold text-indigo-700">
                                                                {opts.map(v => v + '%').join(' / ')}
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {overrideModalOpen && (
                        <ModalOverrideRequest userRole={userRole} onClose={() => setOverrideModalOpen(false)}
                            onSubmit={handleRequestOverride} currentFormData={formData} />
                    )}

                    {transmitModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                                <div className="text-center space-y-2">
                                    <div className="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto"><Icons.Send /></div>
                                    <h3 className="text-base font-bold text-slate-900">Xác Nhận Ký Số & Truyền Tờ Khai</h3>
                                    <p className="text-xs text-slate-500">Tờ khai <span className="font-mono font-bold text-slate-800">{formData.decNo}</span> đã đạt tiêu chuẩn kiểm duyệt HS. Tiến hành kết nối cổng VNACCS/VCIS.</p>
                                </div>
                                <div className="p-3 bg-slate-50 rounded-xl text-xs space-y-2 border border-slate-200">
                                    <div className="flex justify-between"><span className="text-slate-500">Chữ Ký Số Doanh Nghiệp:</span><span className="font-semibold text-slate-800">VNPT-CA USB Token (Valid)</span></div>
                                    <div className="flex justify-between"><span className="text-slate-500">Mã SKU:</span><span className="font-mono font-bold text-slate-700">{formData.sku}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-500">Mã HS Khai Báo:</span><span className="font-mono font-bold text-blue-700">{formData.hsDeclared}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-500">Thuế NK ({importTaxRate}%):</span><span className="font-mono font-bold text-amber-700">${importDutyAmount.toLocaleString(undefined, {maximumFractionDigits: 2})}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-500">Thuế GTGT ({vatRate}%):</span><span className="font-mono font-bold text-indigo-700">${vatAmount.toLocaleString(undefined, {maximumFractionDigits: 2})}</span></div>
                                    <div className="flex justify-between pt-2 border-t border-slate-200">
                                        <span className="text-slate-600 font-semibold">Tổng thuế phải nộp:</span>
                                        <span className="font-mono font-bold text-rose-600">${totalTaxAmount.toLocaleString(undefined, {maximumFractionDigits: 2})}</span>
                                    </div>
                                    <div className="flex justify-between"><span className="text-slate-500">Trạng Thái Kiểm Duyệt:</span><span className="font-bold text-emerald-600">PASSED COMPLIANCE</span></div>
                                </div>
                                <div className="flex space-x-3 pt-2">
                                    <button onClick={() => setTransmitModalOpen(false)}
                                        className="flex-1 py-2.5 border border-slate-300 text-slate-700 rounded-xl font-bold text-xs hover:bg-slate-50 transition">Hủy Bỏ</button>
                                    <button onClick={confirmTransmit}
                                        className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs shadow-lg shadow-emerald-100 transition">Ký Số & Truyền Ngay</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function ModalOverrideRequest({ userRole, onClose, onSubmit, currentFormData }) {
            const [girRule, setGirRule] = React.useState('GIR 3(b)');
            const [reason, setReason] = React.useState('');
            const [fileName, setFileName] = React.useState('Technical_Data_Sheet.pdf');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!reason.trim()) {
                    alert("Vui lòng nhập nội dung giải trình kỹ thuật");
                    return;
                }
                onSubmit({ girRule, reason, fileName });
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-2xl max-w-lg w-full p-6 space-y-5 shadow-2xl">
                        <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                            <div>
                                <h3 className="font-bold text-slate-900 text-base">Phiếu Yêu Cầu Phê Duyệt Mở Khóa Ngoại Lệ HS</h3>
                                <p className="text-xs text-slate-500">Giải trình căn cứ kỹ thuật & 6 Quy tắc GIR Hải quan</p>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 font-bold text-lg">×</button>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Căn Cứ Quy Tắc Giải Thích HS (GIR Rules)</label>
                                <select value={girRule} onChange={(e) => setGirRule(e.target.value)}
                                    className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 font-medium">
                                    <option value="GIR 1">Quy tắc 1: Căn cứ Chú giải Chương/Phần & Tên Nhóm</option>
                                    <option value="GIR 2(a)">Quy tắc 2(a): Hàng chưa hoàn chỉnh/tháo rời</option>
                                    <option value="GIR 3(a)">Quy tắc 3(a): Chọn Nhóm có mô tả cụ thể nhất</option>
                                    <option value="GIR 3(b)">Quy tắc 3(b): Chọn theo Đặc tính cơ bản cấu thành (Essential Character)</option>
                                    <option value="GIR 3(c)">Quy tắc 3(c): Chọn Nhóm có thứ tự cuối cùng</option>
                                    <option value="GIR 6">Quy tắc 6: Phân loại ở cấp Phân nhóm 6-8 chữ số</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Nội Dung Giải Trình Kỹ Thuật Chi Tiết <span className="text-rose-500">*</span></label>
                                <textarea rows="4" value={reason} onChange={(e) => setReason(e.target.value)} required
                                    className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-slate-800"
                                    placeholder="Nêu rõ thành phần %, tài liệu catalog, chức năng chính..." />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Đính Kèm Tài Liệu Kỹ Thuật (Catalog / TDS / COA)</label>
                                <div className="p-3 border-2 border-dashed border-slate-200 rounded-xl flex items-center justify-between text-xs bg-slate-50">
                                    <span className="font-mono text-slate-700 font-medium">📄 {fileName}</span>
                                    <span className="px-2 py-1 bg-blue-100 text-blue-700 rounded font-bold text-[10px]">Đã đính kèm</span>
                                </div>
                            </div>
                            <div className="pt-3 border-t border-slate-100 flex space-x-3">
                                <button type="button" onClick={onClose}
                                    className="flex-1 py-2.5 border border-slate-300 text-slate-700 rounded-xl font-bold text-xs hover:bg-slate-50 transition">Hủy Bỏ</button>
                                <button type="submit"
                                    className="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xs shadow-lg shadow-indigo-100 transition">
                                    {userRole === 'MANAGER' ? 'Phê Duyệt & Mở Khóa Ngay' : 'Gửi Trưởng Phòng Phê Duyệt'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

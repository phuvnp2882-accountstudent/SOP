        };

        const DEFAULT_TAX_OPTIONS = [0, 3, 5, 8, 10, 15, 20];
        const INITIAL_KEYWORDS = ["đa năng", "tổng hợp", "hỗn hợp", "kết hợp", "tích hợp", "chế phẩm", "linh kiện", "bộ", "hệ thống", "tháo rời", "phụ tùng", "pha trộn", "đa loại"];

        const EMPTY_FORM = {
            decNo: '', sku: '', itemName: '', hsDeclared: '',
            importTax: '', vatRate: 10, unitPrice: '', qty: '',
            overrideApproved: false, overrideReason: '', girRule: ''
        };

        const normalizeHS = (code) => (code || '').toString().replace(/[.\s]/g, '').trim();
        const formatHS = (code8) => code8.replace(/(\d{4})(\d{2})(\d{2})/, "$1.$2.$3");
        const normalizeVN = (s) => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();

        const testPattern = (pattern, text) => {
            if (!pattern) return true;
            if (pattern.test(text)) return true;
            try {
                const normalizedSource = normalizeVN(pattern.source);
                const flags = pattern.flags || 'i';
                return new RegExp(normalizedSource, flags).test(text);
            } catch (e) {
                return false;
            }
        };

        const fileToBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });

        const downloadFileFromBase64 = (dataUrl, fileName) => {
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        // ===== SYNC HOOK =====
        const SYNC_CHANNEL = 'hs-gate-sync-channel';
        const STORAGE_KEY_PREFIX = 'hs-gate-';

        function useSyncedState(key, initialValue) {
            const fullKey = STORAGE_KEY_PREFIX + key;
            const [value, setValue] = React.useState(() => {
                try {
                    const stored = localStorage.getItem(fullKey);
                    return stored ? JSON.parse(stored) : initialValue;
                } catch (e) {
                    return initialValue;
                }
            });
            const channelRef = React.useRef(null);

            React.useEffect(() => {
                try {
                    channelRef.current = new BroadcastChannel(SYNC_CHANNEL);
                    const handleMessage = (e) => {
                        if (e.data && e.data.key === fullKey) {
                            setValue(e.data.value);
                        }
                    };
                    channelRef.current.addEventListener('message', handleMessage);
                    return () => {
                        channelRef.current.removeEventListener('message', handleMessage);
                        channelRef.current.close();
                    };
                } catch (e) {
                    console.warn('BroadcastChannel not supported:', e);
                }
            }, [fullKey]);

            React.useEffect(() => {
                const handleStorage = (e) => {
                    if (e.key === fullKey && e.newValue) {
                        try { setValue(JSON.parse(e.newValue)); } catch (err) {}
                    }
                };
                window.addEventListener('storage', handleStorage);
                return () => window.removeEventListener('storage', handleStorage);
            }, [fullKey]);

            const setSyncedValue = React.useCallback((newValue) => {
                setValue(newValue);
                try {
                    localStorage.setItem(fullKey, JSON.stringify(newValue));
                    if (channelRef.current) {
                        channelRef.current.postMessage({ key: fullKey, value: newValue });
                    }
                } catch (e) {
                    console.error('Sync error:', e);
                    if (e.name === 'QuotaExceededError') {
                        alert('Bộ nhớ localStorage đầy (>5MB). Vui lòng xóa bớt phiếu cũ hoặc dùng file nhỏ hơn.');
                    }
                }
            }, [fullKey]);

            return [value, setSyncedValue];
        }

        // ===== APP =====
        function App() {
            const [userRole, setUserRole] = React.useState(() => {
                return localStorage.getItem('hs-gate-role') || 'STAFF';
            });

            const [requests, setRequests] = useSyncedState('requests', []);
            const [sensitiveKeywords, setSensitiveKeywords] = React.useState(INITIAL_KEYWORDS);

            const [staffTab, setStaffTab] = React.useState('create');
            const [managerTab, setManagerTab] = React.useState('pending');

            const [formData, setFormData] = React.useState({ ...EMPTY_FORM });
            const [nameConfirmed, setNameConfirmed] = React.useState(false);

            const [overrideModalOpen, setOverrideModalOpen] = React.useState(false);
            const [transmitModalOpen, setTransmitModalOpen] = React.useState(false);
            const [detailRequest, setDetailRequest] = React.useState(null);
            const [transmitRequest, setTransmitRequest] = React.useState(null);

            const [toast, setToast] = React.useState(null);
            const toastTimerRef = React.useRef(null);
            const showToast = (message, type = 'info') => {
                setToast({ message, type });
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                toastTimerRef.current = setTimeout(() => setToast(null), 3500);
            };

            React.useEffect(() => {
                localStorage.setItem('hs-gate-role', userRole);
            }, [userRole]);

            const managerPending = React.useMemo(() => requests.filter(r => r.status === 'PENDING'), [requests]);
            const managerProcessed = React.useMemo(() => requests.filter(r => r.status !== 'PENDING'), [requests]);

            const hsLookup = React.useMemo(() => {
                const key = normalizeHS(formData.hsDeclared);
                if (!key) return { status: 'EMPTY', ref: null, key };
                const ref = BT2026_REFERENCE[key];
                return ref ? { status: 'FOUND', ref, key } : { status: 'NOT_FOUND', ref: null, key };
            }, [formData.hsDeclared]);

            const currentVatOptions = React.useMemo(() => {
                return hsLookup.status === 'FOUND' ? getVatOptions(hsLookup.ref) : DEFAULT_VAT_OPTIONS;
            }, [hsLookup]);

            const nameHsSemantic = React.useMemo(() => {
                if (!formData.itemName || hsLookup.status !== 'FOUND') {
                    return { status: 'SKIP', details: [] };
                }
                const name = normalizeVN(formData.itemName);
                const code8 = hsLookup.key;
                const heading4 = code8.substring(0, 4);
                const heading = HEADING_PATTERNS[heading4];
                const species = SPECIES_PATTERNS[code8];
                const headingMatched = testPattern(heading ? heading.pattern : null, name);
                const speciesMatched = testPattern(species, name);

                const details = [];
                if (heading && !headingMatched) details.push(`Tên hàng không đề cập loại sản phẩm của nhóm ${heading4} — cần có: "${heading.label}".`);
                if (species && !speciesMatched) details.push(`Mã HS ${code8} yêu cầu loài cây cụ thể nhưng tên hàng không đề cập loài tương ứng.`);
                if (headingMatched && speciesMatched) details.push(`Tên hàng khớp mô tả loại sản phẩm ${heading ? `nhóm ${heading4}` : ''}${species ? ` và loài cây` : ''}.`);
                return { status: headingMatched && speciesMatched ? 'MATCH' : 'MISMATCH', details };
            }, [formData.itemName, hsLookup]);

            const cifValue = (parseFloat(formData.unitPrice) || 0) * (parseFloat(formData.qty) || 0);
            const importTaxRate = parseFloat(formData.importTax) || 0;
            const vatRate = parseFloat(formData.vatRate) || 0;
            const importDutyAmount = cifValue * (importTaxRate / 100);
            const vatBase = cifValue + importDutyAmount;
            const vatAmount = vatBase * (vatRate / 100);
            const totalTaxAmount = importDutyAmount + vatAmount;

            const currentTaxOptions = React.useMemo(() => {
                if (hsLookup.status !== 'FOUND') return DEFAULT_TAX_OPTIONS;
                const { mfn, normal } = hsLookup.ref;
                const opts = [...new Set([0, mfn, normal])].sort((a, b) => a - b);
                const cur = parseFloat(formData.importTax);
                if (!isNaN(cur) && !opts.includes(cur)) opts.push(cur);
                return opts.sort((a, b) => a - b);
            }, [hsLookup, formData.importTax]);

            const hsInputClass = (() => {
                const base = "w-full pl-9 pr-9 py-2 text-sm font-mono rounded-lg focus:outline-none focus:ring-2 transition-all font-semibold ";
                if (!nameConfirmed) return base + "border border-slate-200 bg-slate-100 text-slate-400 cursor-not-allowed";
                if (hsLookup.status === 'FOUND') return base + "border border-emerald-400 bg-emerald-50 text-emerald-800 focus:ring-emerald-500";
                if (hsLookup.status === 'NOT_FOUND') return base + "border border-rose-400 bg-rose-50 text-rose-800 focus:ring-rose-500";
                return base + "border border-slate-300 text-blue-700 focus:ring-blue-500";
            })();

            const handleHsChange = (newHS) => {
                if (!nameConfirmed) {
                    showToast("Vui lòng xác nhận tên hàng trước khi nhập mã HS", "error");
                    return;
                }
                const key = normalizeHS(newHS);
                const ref = BT2026_REFERENCE[key];
                if (ref) {

                    const currentVat = parseFloat(formData.vatRate);
                    const newVat = opts.includes(currentVat) ? currentVat : ref.vat;
                    setFormData(prev => ({ ...prev, hsDeclared: newHS, importTax: ref.mfn, vatRate: String(newVat), overrideApproved: false }));
                } else {
                    setFormData(prev => ({ ...prev, hsDeclared: newHS, importTax: '', vatRate: '8', overrideApproved: false }));
                }
            };

            const handleItemNameChange = (newName) => {
                const wasConfirmed = nameConfirmed;
                setFormData(prev => ({ ...prev, itemName: newName, hsDeclared: '', importTax: '', vatRate: 8, overrideApproved: false }));
                if (wasConfirmed) {

                    showToast("Tên hàng đã thay đổi — mã HS đã được xoá, vui lòng xác nhận lại", "info");

            const inspectRules = React.useCallback(() => {
                let isBlocked = false;

                if (nameConfirmed) layer0.details.push("✓ Tên hàng đã được xác nhận.");
                else { layer0.status = "FAIL"; layer0.details.push("Chưa xác nhận tên hàng."); isBlocked = true; }

                const layer1 = { name: "Tầng 1: Tra Cứu Mã HS Trong BT2026", status: "PASS", details: [] };
                if (hsLookup.status === 'EMPTY') { layer1.status = "FAIL"; layer1.details.push("Chưa nhập mã HS (8 số)."); isBlocked = true; }
                else if (hsLookup.status === 'NOT_FOUND') { layer1.status = "FAIL"; layer1.details.push(`Mã HS [${formData.hsDeclared}] không có trong BT2026.`); isBlocked = true; }
                else { layer1.details.push(`✓ Tra cứu thành công mã HS trong BT2026.`); layer1.details.push(`VAT cho phép: ${currentVatOptions.map(v => v + '%').join(' / ')}.`); }

                const layer2 = { name: "Tầng 2: Đối Chiếu Tên Hàng ↔ Mô Tả Mã HS", status: "PASS", details: [] };
                if (nameHsSemantic.status === 'SKIP') { layer2.status = "WARN"; layer2.details.push("Chưa đủ dữ liệu để đối chiếu."); }
                else if (nameHsSemantic.status === 'MISMATCH') { layer2.status = "FAIL"; layer2.details.push("⚠️ Tên hàng KHÔNG khớp với mô tả mã HS — chặn truyền."); nameHsSemantic.details.forEach(d => layer2.details.push(d)); isBlocked = true; }
                else { nameHsSemantic.details.forEach(d => layer2.details.push(d)); }

                const layer3 = { name: "Tầng 3: Kiểm Tra Thuế NK & VAT", status: "PASS", details: [] };
                const taxVal = parseFloat(formData.importTax);
                const vatVal = parseFloat(formData.vatRate);
                if (hsLookup.status !== 'FOUND') { layer3.status = "FAIL"; layer3.details.push("Chưa xác thực mã HS."); isBlocked = true; }
                else if (isNaN(taxVal)) { layer3.status = "FAIL"; layer3.details.push("Chưa chọn Thuế suất Nhập khẩu."); isBlocked = true; }
                else if (taxVal === 0) { layer3.status = "FAIL"; layer3.details.push("Thuế NK 0%: Thuộc danh mục rủi ro FTA — cần giải trình xuất xứ."); isBlocked = true; }
                else layer3.details.push(`Thuế NK ${taxVal}%. Tiền thuế = ${importDutyAmount.toLocaleString(undefined, {maximumFractionDigits: 2})} USD.`);

                if (isNaN(vatVal) || !currentVatOptions.includes(vatVal)) { layer3.status = "FAIL"; layer3.details.push(`VAT [${formData.vatRate}] không hợp lệ.`); isBlocked = true; }
                else layer3.details.push(`VAT ${vatVal}% hợp lệ.`);

                const priceVal = parseFloat(formData.unitPrice);
                const qtyVal = parseFloat(formData.qty);
                if (isNaN(priceVal) || priceVal <= 0) { layer3.status = "FAIL"; layer3.details.push("Đơn giá phải > 0."); isBlocked = true; }
                if (isNaN(qtyVal) || qtyVal <= 0) { layer3.status = "FAIL"; layer3.details.push("Số lượng phải > 0."); isBlocked = true; }

                const layer4 = { name: "Tầng 4: Từ Khóa Nhạy Cảm & Mô Tả 4 Thành Phần", status: "PASS", details: [] };
                const nameLower = normalizeVN(formData.itemName);
                const matchedKw = sensitiveKeywords.filter(kw => nameLower.includes(normalizeVN(kw)));
                if (matchedKw.length > 0) { layer4.status = "FAIL"; layer4.details.push(`Từ khóa nhạy cảm: [${matchedKw.join(', ')}].`); isBlocked = true; }
                else layer4.details.push("Không chứa từ khóa mơ hồ.");

                const hasModel = /model|mã|type|code|kích thước|dày\s*\d|\d+\s*mm|\d+\s*cm|khổ\s*\d/i.test(formData.itemName);
                const hasMaterial = /gỗ|tre|nứa|thông|sồi|tếch|bạch đàn|cao su|dừa|tràm|keo|mùn cưa|dăm|gáo|vỏ|Pinus|Quercus|Tectona|Acacia|Hevea|Betula|Populus|Abies|Picea|Fagus/i.test(formData.itemName);
                const hasFunction = /nhiên liệu|đốt|nén|ép|xẻ|cưa|bào|chà nhám|nghiền|sản xuất|chế biến|đóng gói|viên|khối|dùng|làm|ván|nội thất|đóng tàu/i.test(formData.itemName);

                const missing = [];
                if (!hasMaterial) missing.push("Chất liệu/Loài gỗ");
                if (!hasFunction) missing.push("Công dụng");
                if (!hasModel) missing.push("Model/Thông số");
                if (missing.length > 0) {
                    if (missing.length >= 2) { layer4.status = "FAIL"; isBlocked = true; }
                    else { layer4.status = layer4.status === "FAIL" ? "FAIL" : "WARN"; }
                    layer4.details.push(`Mô tả thiếu: [${missing.join(', ')}].`);
                } else layer4.details.push("Mô tả đạt chuẩn 4 thành phần SOP.");

                return { isBlocked, layers: [layer0, layer1, layer2, layer3, layer4] };
            }, [formData, hsLookup, nameHsSemantic, sensitiveKeywords, importDutyAmount, vatAmount, currentTaxOptions, currentVatOptions, nameConfirmed]);

            const currentInspection = inspectRules();
            const isOverrideApproved = formData.overrideApproved === true;

            const hasRequiredFields =
                formData.decNo.trim() &&
                formData.itemName.trim() &&
                formData.hsDeclared.trim() &&
                formData.importTax !== '' &&
                formData.vatRate !== '' &&
                formData.unitPrice !== '' &&
                formData.qty !== '';

            const canTransmit = hasRequiredFields && (isOverrideApproved || !currentInspection.isBlocked);
            const finalStatus = isOverrideApproved ? "APPROVED_OVERRIDE" : (currentInspection.isBlocked ? "BLOCKED" : "PASSED");

            const handleRequestOverride = async (overrideForm) => {
                setOverrideModalOpen(false);
                if (userRole === 'MANAGER') {
                    setFormData(prev => ({ ...prev, overrideApproved: true, overrideReason: overrideForm.reason, girRule: overrideForm.girRule }));

                const newRequest = {
                    id: `REQ-${Date.now()}-${Math.floor(Math.random() * 1000)}`,

                    fileBase64: overrideForm.fileBase64 || null,
                    fileSize: overrideForm.fileSize || 0,
                    reason: overrideForm.reason,
                    girRule: overrideForm.girRule,
                    status: 'PENDING',
                    requestedAt: new Date().toISOString().replace('T', ' ').substring(0, 16),
                    approvedAt: null,
                    transmittedAt: null,
                    approvedBy: null
                };
                setRequests(prev => [newRequest, ...prev]);
                showToast(`Đã gửi phiếu — chờ Trưởng phòng duyệt`, "success");
            };

            const approveRequest = (requestId) => {
                setRequests(prev => prev.map(r => r.id === requestId ? { ...r, status: 'APPROVED', approvedAt: new Date().toISOString().replace('T', ' ').substring(0, 16), approvedBy: 'Trưởng phòng Logistics' } : r));
                showToast(`Đã phê duyệt phiếu ${requestId}`, "success");
            };

            const rejectRequest = (requestId) => {
                setRequests(prev => prev.map(r => r.id === requestId ? { ...r, status: 'REJECTED', approvedAt: new Date().toISOString().replace('T', ' ').substring(0, 16), approvedBy: 'Trưởng phòng (Từ chối)' } : r));
                showToast(`Đã từ chối phiếu ${requestId}`, "error");
            };

            const transmitRequest = (requestId) => {
                setRequests(prev => prev.map(r => r.id === requestId ? { ...r, status: 'TRANSMITTED', transmittedAt: new Date().toISOString().replace('T', ' ').substring(0, 16) } : r));
                showToast(`Đã truyền tờ khai lên VNACCS!`, "success");
                setTransmitRequest(null);
            };

            const deleteRequest = (requestId) => {
                if (!window.confirm('Bạn có chắc muốn xóa phiếu này?')) return;
                setRequests(prev => prev.filter(r => r.id !== requestId));
                showToast(`Đã xóa phiếu`, "info");
            };

            const handleResetForm = () => {
                setFormData({ ...EMPTY_FORM });
                setNameConfirmed(false);
                showToast("Đã xoá toàn bộ form", "info");
            };

            const openDetail = (request) => setDetailRequest(request);

            const isTaxEnabled = hsLookup.status === 'FOUND' && nameConfirmed;
            const isFormLocked = !nameConfirmed;
            const staffApprovedCount = requests.filter(r => r.status === 'APPROVED').length;
            const managerPendingCount = managerPending.length;

            return (
                <div className="min-h-screen flex flex-col bg-slate-100">
                    <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 shadow-md">
                        <div className="max-w-[1800px] mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-16">
                                <div className="flex items-center space-x-3">
                                    <div className="p-2 bg-blue-600 text-white rounded-lg shadow-lg"><Icons.ShieldCheck /></div>
                                    <div>
                                        <h1 className="font-bold text-lg leading-tight tracking-wide text-white">HS COMPLIANCE GATE</h1>
                                        <p className="text-xs text-blue-300 font-medium">Hệ Thống Khóa Luồng Cảnh Báo Mã HS Tự Động · 2-Tab Sync</p>
                                    </div>
                                </div>
                                <div className="flex items-center space-x-4">
                                    <div className="bg-emerald-900/50 border border-emerald-700 px-3 py-1.5 rounded-lg text-xs">
                                        <span className="text-emerald-300">✓ Đồng bộ 2 tab:</span>
                                        <span className="text-white font-bold ml-1">{requests.length} phiếu · {managerPendingCount} chờ duyệt</span>
                                    </div>
                                    <div className="bg-slate-800 border border-slate-700 p-1 rounded-xl flex items-center text-xs">
                                        <span className="text-slate-400 px-2 font-medium">Tab này là:</span>
                                        <button onClick={() => { setUserRole('STAFF'); showToast("Tab này: Chuyên viên XNK", "info"); }}
                                            className={`px-3 py-1.5 rounded-lg font-semibold transition-all ${userRole === 'STAFF' ? 'bg-blue-600 text-white shadow' : 'text-slate-300 hover:text-white'}`}>👨‍💼 Chuyên viên</button>
                                        <button onClick={() => { setUserRole('MANAGER'); showToast("Tab này: Trưởng phòng", "info"); }}
                                            className={`px-3 py-1.5 rounded-lg font-semibold transition-all ${userRole === 'MANAGER' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:text-white'}`}>🛡️ Trưởng phòng</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>

                    {toast && (

                            className={`px-4 py-2.5 text-sm font-semibold border-b-2 transition ${managerTab === 'processed' ? 'border-indigo-600 text-indigo-700' : 'border-transparent text-slate-500 hover:text-slate-700'}`}>

                    {managerTab === 'pending' && (
                        <RequestList requests={pendingRequests} openDetail={openDetail} approveRequest={approveRequest} rejectRequest={rejectRequest} viewMode="manager-pending" />

                        <p className="text-sm font-semibold text-slate-700 mb-1">Chưa có phiếu nào</p>
                        <p className="text-xs text-slate-500">
                            {viewMode === 'staff' && 'Gửi phiếu yêu cầu duyệt ở tab "Tờ Khai Mới"'}
                            {viewMode === 'manager-pending' && 'Không có phiếu chờ duyệt'}
                            {viewMode === 'manager-processed' && 'Chưa xử lý phiếu nào'}
                        </p>
                    </div>
                );
            }
            return (
                <div className="space-y-3">
                    {requests.map(req => (
                        <RequestCard key={req.id} request={req} openDetail={openDetail} deleteRequest={deleteRequest}
                            setTransmitRequest={setTransmitRequest} approveRequest={approveRequest} rejectRequest={rejectRequest} viewMode={viewMode} />
                    ))}
                </div>
            );
        }

        // ===== REQUEST CARD =====
        function RequestCard({ request, openDetail, deleteRequest, setTransmitRequest, approveRequest, rejectRequest, viewMode }) {
            const statusConfig = {
                PENDING: { bg: 'bg-amber-50 border-amber-200', badge: 'bg-amber-100 text-amber-800', label: '⏳ Chờ duyệt' },
                APPROVED: { bg: 'bg-emerald-50 border-emerald-200', badge: 'bg-emerald-100 text-emerald-800', label: '✓ Đã duyệt' },
                REJECTED: { bg: 'bg-rose-50 border-rose-200', badge: 'bg-rose-100 text-rose-800', label: '✗ Từ chối' },
                TRANSMITTED: { bg: 'bg-blue-50 border-blue-200', badge: 'bg-blue-100 text-blue-800', label: '🚀 Đã truyền' }
            };
            const cfg = statusConfig[request.status] || statusConfig.PENDING;

            return (
                <div className={`rounded-2xl border-2 p-5 ${cfg.bg} transition hover:shadow-md`}>
                    <div className="flex justify-between items-start gap-4 mb-3">
                        <div className="flex-1 min-w-0">
                            <div className="flex items-center gap-2 mb-1 flex-wrap">
                                <span className={`px-2.5 py-1 rounded-md text-[10px] font-bold uppercase ${cfg.badge}`}>{cfg.label}</span>
                                <span className="font-mono text-xs font-bold text-slate-700">{request.id}</span>
                                <span className="text-[10px] text-slate-500 font-mono">· {request.requestedAt}</span>
                            </div>
                            <p className="font-mono font-bold text-sm text-slate-900 truncate">{request.formData.decNo || '(Chưa có mã tờ khai)'}</p>
                            <p className="text-xs text-slate-700 truncate mt-0.5" title={request.formData.itemName}>{request.formData.itemName}</p>
                        </div>
                        <div className="text-right shrink-0">
                            <div className="text-xs text-slate-600">Mã HS</div>
                            <div className="font-mono font-bold text-blue-700">{request.formData.hsDeclared}</div>
                        </div>
                    </div>

                    <div className="grid grid-cols-4 gap-3 mb-3 p-3 bg-white/70 rounded-lg border border-slate-200">
                        <div><p className="text-[10px] text-slate-500 uppercase font-bold">Đơn giá</p><p className="text-xs font-mono font-bold text-slate-800">${request.formData.unitPrice || '0'}</p></div>
                        <div><p className="text-[10px] text-slate-500 uppercase font-bold">Số lượng</p><p className="text-xs font-mono font-bold text-slate-800">{request.formData.qty || '0'}</p></div>
                        <div><p className="text-[10px] text-slate-500 uppercase font-bold">Thuế NK</p><p className="text-xs font-mono font-bold text-amber-700">{request.formData.importTax || '0'}%</p></div>
                        <div><p className="text-[10px] text-slate-500 uppercase font-bold">VAT</p><p className="text-xs font-mono font-bold text-indigo-700">{request.formData.vatRate || '0'}%</p></div>
                    </div>

                    <div className="mb-3 p-2 bg-white/70 rounded-lg border border-slate-200">
                        <p className="text-[10px] text-slate-500 uppercase font-bold mb-0.5">Lý do · {request.girRule}</p>
                        <p className="text-[11px] text-slate-700 line-clamp-2">{request.reason}</p>
                    </div>

                    <div className="flex items-center justify-between gap-2 flex-wrap">
                        <div className="flex items-center gap-2">
                            {request.fileBase64 ? (
                                <button onClick={() => downloadFileFromBase64(request.fileBase64, request.fileName)}
                                    className="px-3 py-1.5 bg-slate-700 hover:bg-slate-800 text-white rounded-lg font-bold text-[10px] transition flex items-center space-x-1 shadow">
                                    <Icons.Download /><span>Tải file ({request.fileName})</span>
                                </button>
                            ) : (
                                <span className="text-[10px] text-slate-400 italic">📎 Không đính kèm</span>
                            )}
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={() => openDetail(request)}
                                className="px-3 py-1.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 rounded-lg font-semibold text-[10px] transition flex items-center space-x-1">
                                <Icons.Eye /><span>Xem chi tiết</span>
                            </button>
                            {viewMode === 'staff' && request.status === 'APPROVED' && (
                                <button onClick={() => setTransmitRequest(request)}
                                    className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold text-[10px] transition flex items-center space-x-1 shadow-lg shadow-emerald-200 animate-pulse">
                                    <Icons.Send /><span>🚀 TRUYỀN</span>
                                </button>
                            )}
                            {viewMode === 'staff' && (request.status === 'PENDING' || request.status === 'REJECTED') && deleteRequest && (
                                <button onClick={() => deleteRequest(request.id)}
                                    className="px-3 py-1.5 bg-white border border-rose-300 hover:bg-rose-50 text-rose-600 rounded-lg font-semibold text-[10px] transition flex items-center space-x-1">
                                    <Icons.X /><span>Xóa</span>
                                </button>
                            )}
                            {viewMode === 'manager-pending' && (
                                <>
                                    <button onClick={() => approveRequest(request.id)}
                                        className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold text-[10px] transition flex items-center space-x-1 shadow">
                                        <Icons.CheckCircle /><span>✓ Duyệt</span>
                                    </button>
                                    <button onClick={() => rejectRequest(request.id)}
                                        className="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-lg font-bold text-[10px] transition flex items-center space-x-1 shadow">
                                        <Icons.XCircle /><span>✗ Từ chối</span>
                                    </button>
                                </>
                            )}
                        </div>
                    </div>

                    {request.approvedAt && (
                        <p className="mt-2 pt-2 border-t border-slate-200 text-[10px] text-slate-500">
                            Duyệt lúc: <span className="font-mono">{request.approvedAt}</span> · bởi <b>{request.approvedBy}</b>
                        </p>
                    )}
                    {request.transmittedAt && (
                        <p className="mt-2 pt-2 border-t border-slate-200 text-[10px] text-blue-600 font-semibold">
                            🚀 Truyền lúc: <span className="font-mono">{request.transmittedAt}</span>
                        </p>
                    )}
                </div>
            );
        }

        // ===== MODAL DETAIL =====
        function ModalDetailRequest({ request, onClose }) {
            if (!request) return null;
            const f = request.formData;
            const cifValue = (parseFloat(f.unitPrice) || 0) * (parseFloat(f.qty) || 0);
            const importTaxRate = parseFloat(f.importTax) || 0;
            const vatRate = parseFloat(f.vatRate) || 0;
            const importDutyAmount = cifValue * (importTaxRate / 100);
            const vatBase = cifValue + importDutyAmount;
            const vatAmount = vatBase * (vatRate / 100);
            const totalTaxAmount = importDutyAmount + vatAmount;

            const statusConfig = {
                PENDING: { bg: 'bg-amber-100 text-amber-800 border-amber-200', label: '⏳ Chờ duyệt' },
                APPROVED: { bg: 'bg-emerald-100 text-emerald-800 border-emerald-200', label: '✓ Đã duyệt' },
                REJECTED: { bg: 'bg-rose-100 text-rose-800 border-rose-200', label: '✗ Từ chối' },
                TRANSMITTED: { bg: 'bg-blue-100 text-blue-800 border-blue-200', label: '🚀 Đã truyền' }
            };
            const cfg = statusConfig[request.status] || statusConfig.PENDING;

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-hidden flex flex-col shadow-2xl">
                        <div className="p-5 border-b border-slate-100 flex justify-between items-start">
                            <div className="flex-1 min-w-0">
                                <div className="flex items-center gap-2 mb-1 flex-wrap">
                                    <span className={`px-2.5 py-1 rounded-md text-[10px] font-bold uppercase border ${cfg.bg}`}>{cfg.label}</span>
                                    <span className="font-mono text-xs font-bold text-slate-700">{request.id}</span>
                                </div>
                                <h3 className="font-bold text-slate-900 text-base">Chi Tiết Phiếu Yêu Cầu</h3>
                            </div>
                            <button onClick={onClose} className="p-1.5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition"><Icons.X /></button>
                        </div>

                        <div className="p-5 overflow-y-auto space-y-4">
                            <div>
                                <h4 className="text-xs font-bold text-slate-500 uppercase mb-2">📋 Thông Tin Tờ Khai</h4>
                                <div className="grid grid-cols-2 gap-3 p-4 bg-slate-50 rounded-xl border border-slate-200">
                                    <div><p className="text-[10px] text-slate-500 uppercase font-bold">Mã Tờ Khai</p><p className="font-mono font-bold text-slate-900 text-sm">{f.decNo || '—'}</p></div>
                                    <div><p className="text-[10px] text-slate-500 uppercase font-bold">Mã SKU</p><p className="font-mono font-bold text-slate-700 text-sm">{f.sku || '—'}</p></div>
                                    <div className="col-span-2"><p className="text-[10px] text-slate-500 uppercase font-bold">Tên Hàng Hóa</p><p className="text-sm text-slate-800">{f.itemName}</p></div>
                                    <div><p className="text-[10px] text-slate-500 uppercase font-bold">Mã HS</p><p className="font-mono font-bold text-blue-700 text-sm">{f.hsDeclared}</p></div>
                                </div>
                            </div>

                            <div>
                                <h4 className="text-xs font-bold text-slate-500 uppercase mb-2">🧾 Trị Giá & Thuế</h4>
                                <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div><p className="text-[10px] text-slate-500 uppercase font-bold">Đơn Giá (USD)</p><p className="font-mono font-bold text-slate-900 text-sm">${f.unitPrice || '0'}</p></div>
                                        <div><p className="text-[10px] text-slate-500 uppercase font-bold">Số Lượng</p><p className="font-mono font-bold text-slate-900 text-sm">{f.qty || '0'}</p></div>
                                    </div>
                                    <div className="pt-2 border-t border-slate-200 space-y-1 text-xs">
                                        <div className="flex justify-between"><span className="text-slate-600">Trị giá CIF:</span><span className="font-mono font-bold text-slate-900">${cifValue.toLocaleString()}</span></div>
                                        <div className="flex justify-between"><span className="text-slate-600">Thuế NK ({importTaxRate}%):</span><span className="font-mono font-bold text-amber-700">${importDutyAmount.toLocaleString(undefined, {maximumFractionDigits: 2})}</span></div>
                                        <div className="flex justify-between"><span className="text-slate-600">VAT ({vatRate}%):</span><span className="font-mono font-bold text-indigo-700">${vatAmount.toLocaleString(undefined, {maximumFractionDigits: 2})}</span></div>
                                        <div className="flex justify-between pt-1 border-t border-slate-300">
                                            <span className="font-bold text-slate-800">TỔNG THUẾ:</span>
                                            <span className="font-mono font-bold text-rose-600">${totalTaxAmount.toLocaleString(undefined, {maximumFractionDigits: 2})}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div>
                                <h4 className="text-xs font-bold text-slate-500 uppercase mb-2">📝 Giải Trình Kỹ Thuật</h4>
                                <div className="p-4 bg-amber-50 rounded-xl border border-amber-200 space-y-2">
                                    <div><p className="text-[10px] text-amber-700 uppercase font-bold">Căn cứ GIR</p><p className="font-bold text-amber-900 text-sm">{request.girRule}</p></div>
                                    <div><p className="text-[10px] text-amber-700 uppercase font-bold">Nội dung</p><p className="text-sm text-amber-900 whitespace-pre-wrap">{request.reason}</p></div>
                                </div>
                            </div>

                            {request.fileBase64 && (
                                <div>
                                    <h4 className="text-xs font-bold text-slate-500 uppercase mb-2">📎 Tài Liệu Đính Kèm</h4>
                                    <button onClick={() => downloadFileFromBase64(request.fileBase64, request.fileName)}
                                        className="w-full p-3 bg-blue-50 hover:bg-blue-100 border-2 border-blue-200 rounded-xl flex items-center justify-between transition">
                                        <div className="flex items-center gap-2 min-w-0 flex-1">
                                            <div className="p-2 bg-blue-100 text-blue-600 rounded-lg shrink-0"><Icons.FileText /></div>
                                            <div className="min-w-0 flex-1 text-left">
                                                <p className="font-mono text-xs font-bold text-blue-900 truncate">{request.fileName}</p>
                                                {request.fileSize > 0 && (<p className="text-[10px] text-blue-700">{(request.fileSize / 1024).toFixed(1)} KB</p>)}
                                            </div>
                                        </div>
                                        <span className="px-3 py-1.5 bg-blue-600 text-white rounded-lg font-bold text-[10px] flex items-center space-x-1 shrink-0">
                                            <Icons.Download /><span>Tải về</span>
                                        </span>
                                    </button>
                                </div>
                            )}

                            <div>
                                <h4 className="text-xs font-bold text-slate-500 uppercase mb-2">⏰ Lịch Sử</h4>
                                <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-1 text-xs">
                                    <div className="flex justify-between"><span className="text-slate-600">Gửi lúc:</span><span className="font-mono font-semibold">{request.requestedAt}</span></div>
                                    {request.approvedAt && <div className="flex justify-between"><span className="text-slate-600">Duyệt lúc:</span><span className="font-mono font-semibold">{request.approvedAt}</span></div>}
                                    {request.transmittedAt && <div className="flex justify-between"><span className="text-slate-600">Truyền lúc:</span><span className="font-mono font-semibold text-blue-700">{request.transmittedAt}</span></div>}
                                </div>
                            </div>
                        </div>

                        <div className="p-4 border-t border-slate-100 flex justify-end">
                            <button onClick={onClose} className="px-4 py-2 bg-slate-700 hover:bg-slate-800 text-white rounded-xl font-bold text-xs transition">Đóng</button>
                        </div>
                    </div>
                </div>
            );
        }

        // ===== MODAL TRANSMIT =====
        function ModalTransmitConfirm({ request, onClose, onConfirm }) {
            if (!request) return null;
            const f = request.formData;
            const cifValue = (parseFloat(f.unitPrice) || 0) * (parseFloat(f.qty) || 0);
            const importTaxRate = parseFloat(f.importTax) || 0;
            const vatRate = parseFloat(f.vatRate) || 0;
            const importDutyAmount = cifValue * (importTaxRate / 100);
            const vatBase = cifValue + importDutyAmount;
            const vatAmount = vatBase * (vatRate / 100);
            const totalTaxAmount = importDutyAmount + vatAmount;

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                        <div className="text-center space-y-2">
                            <div className="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto"><Icons.Send /></div>
                            <h3 className="text-base font-bold text-slate-900">Xác Nhận Ký Số & Truyền Tờ Khai</h3>
                            <p className="text-xs text-slate-500">Phiếu <span className="font-mono font-bold">{request.id}</span> đã được duyệt.</p>
                        </div>
                        <div className="p-3 bg-slate-50 rounded-xl text-xs space-y-2 border border-slate-200">
                            <div className="flex justify-between"><span className="text-slate-500">Mã Tờ Khai:</span><span className="font-mono font-bold text-slate-800">{f.decNo || '—'}</span></div>
                            <div className="flex justify-between"><span className="text-slate-500">SKU:</span><span className="font-mono font-bold">{f.sku || '—'}</span></div>
                            <div className="flex justify-between"><span className="text-slate-500">Mã HS:</span><span className="font-mono font-bold text-blue-700">{f.hsDeclared}</span></div>
                            <div className="flex justify-between"><span className="text-slate-500">Thuế NK:</span><span className="font-mono font-bold text-amber-700">${importDutyAmount.toLocaleString(undefined, {maximumFractionDigits: 2})}</span></div>
                            <div className="flex justify-between"><span className="text-slate-500">VAT:</span><span className="font-mono font-bold text-indigo-700">${vatAmount.toLocaleString(undefined, {maximumFractionDigits: 2})}</span></div>
                            <div className="flex justify-between pt-2 border-t border-slate-200">
                                <span className="font-semibold text-slate-600">TỔNG:</span>
                                <span className="font-mono font-bold text-rose-600">${totalTaxAmount.toLocaleString(undefined, {maximumFractionDigits: 2})}</span>
                            </div>
                        </div>
                        <div className="flex space-x-3 pt-2">
                            <button onClick={onClose} className="flex-1 py-2.5 border border-slate-300 text-slate-700 rounded-xl font-bold text-xs hover:bg-slate-50 transition">Hủy</button>
                            <button onClick={onConfirm} className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs shadow-lg transition">🚀 Ký Số & Truyền</button>
                        </div>
                    </div>
                </div>
            );
        }

        // ===== MODAL OVERRIDE =====
        function ModalOverrideRequest({ userRole, onClose, onSubmit }) {
            const [girRule, setGirRule] = React.useState('GIR 3(b)');
            const [reason, setReason] = React.useState('');
            const [attachedFile, setAttachedFile] = React.useState(null);
            const [processing, setProcessing] = React.useState(false);
            const fileInputRef = React.useRef(null);

            const handleFileSelect = async (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                if (file.size > 5 * 1024 * 1024) {
                    alert("File quá lớn. Vui lòng chọn file dưới 5MB.");
                    return;
                }
                setProcessing(true);
                try {
                    const base64 = await fileToBase64(file);
                    setAttachedFile({ name: file.name, size: file.size, type: file.type, base64 });
                } catch (err) {
                    alert("Lỗi đọc file: " + err.message);
                } finally {
                    setProcessing(false);
                }
            };

            const handleRemoveFile = () => {
                setAttachedFile(null);
                if (fileInputRef.current) fileInputRef.current.value = '';
            };

            const formatSize = (bytes) => {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!reason.trim()) { alert("Vui lòng nhập nội dung giải trình kỹ thuật"); return; }
                onSubmit({
                    girRule, reason,
                    fileName: attachedFile ? attachedFile.name : 'Chưa đính kèm',
                    fileBase64: attachedFile ? attachedFile.base64 : null,
                    fileSize: attachedFile ? attachedFile.size : 0
                });
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-2xl max-w-lg w-full p-6 space-y-5 shadow-2xl">
                        <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                            <div>
                                <h3 className="font-bold text-slate-900 text-base">
                                    {userRole === 'MANAGER' ? 'Phê Duyệt Mở Khóa Ngoại Lệ' : 'Phiếu Yêu Cầu Mở Khóa Ngoại Lệ'}
                                </h3>
                                <p className="text-xs text-slate-500">Giải trình căn cứ kỹ thuật & Quy tắc GIR</p>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 font-bold text-lg">×</button>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Căn Cứ GIR</label>
                                <select value={girRule} onChange={(e) => setGirRule(e.target.value)}
                                    className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 font-medium">
                                    <option value="GIR 1">Quy tắc 1: Chú giải Chương/Phần & Tên Nhóm</option>
                                    <option value="GIR 2(a)">Quy tắc 2(a): Hàng chưa hoàn chỉnh/tháo rời</option>
                                    <option value="GIR 3(a)">Quy tắc 3(a): Nhóm có mô tả cụ thể nhất</option>
                                    <option value="GIR 3(b)">Quy tắc 3(b): Đặc tính cơ bản cấu thành</option>
                                    <option value="GIR 3(c)">Quy tắc 3(c): Nhóm có thứ tự cuối cùng</option>
                                    <option value="GIR 6">Quy tắc 6: Phân loại cấp phân nhóm 6-8 chữ số</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Nội Dung Giải Trình <span className="text-rose-500">*</span></label>
                                <textarea rows="4" value={reason} onChange={(e) => setReason(e.target.value)} required
                                    className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-slate-800"
                                    placeholder="Nêu rõ thành phần, tài liệu, căn cứ phân loại..." />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Đính Kèm Tài Liệu (tối đa 5MB)</label>
                                <input ref={fileInputRef} type="file" onChange={handleFileSelect}
                                    accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.txt,.csv" className="hidden" />
                                {processing ? (
                                    <div className="p-4 border-2 border-dashed border-blue-300 bg-blue-50 rounded-xl text-center text-xs text-blue-700">⏳ Đang xử lý file...</div>
                                ) : !attachedFile ? (
                                    <button type="button" onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                        className="w-full p-4 border-2 border-dashed border-slate-300 hover:border-blue-400 hover:bg-blue-50/40 rounded-xl flex flex-col items-center justify-center gap-2 text-xs bg-slate-50 transition cursor-pointer group">
                                        <span className="text-slate-400 group-hover:text-blue-500 transition"><Icons.Upload /></span>
                                        <span className="font-semibold text-slate-600 group-hover:text-blue-700">Bấm để chọn file</span>
                                        <span className="text-[10px] text-slate-400">PDF, Word, Excel, ảnh — tối đa 5MB</span>
                                    </button>
                                ) : (
                                    <div className="p-3 border-2 border-emerald-300 bg-emerald-50/40 rounded-xl flex items-center justify-between gap-3">
                                        <div className="flex items-center gap-2 min-w-0 flex-1">
                                            <div className="p-2 bg-emerald-100 text-emerald-600 rounded-lg shrink-0"><Icons.FileText /></div>
                                            <div className="min-w-0 flex-1">
                                                <p className="font-mono text-xs font-semibold text-slate-800 truncate">{attachedFile.name}</p>
                                                <p className="text-[10px] text-slate-500">{formatSize(attachedFile.size)}</p>
                                            </div>
                                        </div>
                                        <button type="button" onClick={handleRemoveFile} className="p-1.5 text-rose-500 hover:bg-rose-100 rounded-lg transition shrink-0"><Icons.X /></button>
                                    </div>
                                )}
                            </div>
                            <div className="pt-3 border-t border-slate-100 flex space-x-3">
                                <button type="button" onClick={onClose} className="flex-1 py-2.5 border border-slate-300 text-slate-700 rounded-xl font-bold text-xs hover:bg-slate-50 transition">Hủy</button>
                                <button type="submit" disabled={processing}
                                    className={`flex-1 py-2.5 rounded-xl font-bold text-xs shadow-lg transition ${processing ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 text-white'}`}>
                                    {userRole === 'MANAGER' ? 'Phê Duyệt Ngay' : 'Gửi Trưởng Phòng Duyệt'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
